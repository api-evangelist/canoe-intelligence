  /v1/documents/{allocationId}/allocation-tags:
    patch:
      tags:
      - Documents
      summary: Update Allocation Tags
      description: Update the allocation tags for a specific document allocation. You can either add tags to existing ones or completely replace them using the overwrite option.
      operationId: updateAllocationTags
      parameters:
      - name: allocationId
        in: path
        description: The unique identifier of the allocation
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: object
                  description: Tags configuration object
                  properties:
                    names:
                      type: array
                      description: Array of tag names (not IDs) to associate with the allocation. Tag names cannot contain the pipe character (|).
                      items:
                        type: string
                      example:
                      - Q1 2024
                      - Reviewed
                      - Priority
                    overwrite:
                      type: boolean
                      description: If true, replaces all existing tags with the provided tags. If false, adds the provided tags to existing tags.
                      example: false
                  required:
                  - names
                  - overwrite
                integration_source:
                  type: string
                  description: Optional integration source identifier (e.g., 'addepar', 'dynamo-crm'). Used for tracking API calls from integrations.
                  example: addepar
              required:
              - tags
      responses:
        '200':
          description: Success - Returns the allocation ID and updated tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The allocation ID
                  tags:
                    type: array
                    description: Array of tags associated with the allocation
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Tag ID
                        name:
                          type: string
                          description: Tag name
              example:
                id: allocation_12345
                tags:
                - id: tag_001
                  name: Q1 2024
                - id: tag_002
                  name: Reviewed
                - id: tag_003
                  name: Priority
        '400':
          description: Bad Request - Invalid tags provided or tag name contains pipe character (|)
        '403':
          description: Forbidden - No access to the allocation
        '404':
          description: Not Found - Allocation not found
        '422':
          description: Unprocessable Entity - Validation failed
      x-codeSamples:
      - lang: bash
        label: Bash
        source: "curl -X PATCH \\\n          \"https://api.canoesoftware.com/v1/documents/allocation_12345/allocation-tags\" \\\n          -H \"Authorization: Bearer {token}\" \\\n          -H \"Accept: application/json\" \\\n          -H \"X-Requested-With: XMLHttpRequest\" \\\n          -H \"Content-Type: application/json\" \\\n          -d '{\"tags\":{\"names\":[\"Q1 2024\",\"Reviewed\",\"Priority\"],\"overwrite\":false}}'"
      - lang: javascript
        label: JavaScript
        source: "const url = new URL(\n          \"https://api.canoesoftware.com/v1/documents/allocation_12345/allocation-tags\"\n      );\n\n      let headers = {\n          \"Authorization\": \"Bearer {token}\",\n          \"Accept\": \"application/json\",\n          \"X-Requested-With\": \"XMLHttpRequest\",\n          \"Content-Type\": \"application/json\",\n      };\n\n      let body = {\n          \"tags\": {\n              \"names\": [\"Q1 2024\", \"Reviewed\", \"Priority\"],\n              \"overwrite\": false\n          }\n      };\n\n      fetch(url, {\n          method: \"PATCH\",\n          headers: headers,\n          body: JSON.stringify(body)\n      })\n      .then(response => response.json())\n      .then(json => console.log(json));"
      - lang: php
        label: PHP
        source: "$client = new \\GuzzleHttp\\Client();\n      $response = $client->patch(\n          'https://api.canoesoftware.com/v1/documents/allocation_12345/allocation-tags',\n          [\n              'headers' => [\n                  'Authorization' => 'Bearer {token}',\n                  'Accept' => 'application/json',\n                  'X-Requested-With' => 'XMLHttpRequest',\n                  'Content-Type' => 'application/json',\n              ],\n              'json' => [\n                  'tags' => [\n                      'names' => ['Q1 2024', 'Reviewed', 'Priority'],\n                      'overwrite' => false,\n                  ],\n              ],\n          ]\n      );\n      $body = $response->getBody();\n      print_r(json_decode((string) $body));"
      - lang: python
        label: Python
        source: "import requests\n      import json\n\n      url = 'https://api.canoesoftware.com/v1/documents/allocation_12345/allocation-tags'\n      headers = {\n        'Authorization': 'Bearer {token}',\n        'Accept': 'application/json',\n        'X-Requested-With': 'XMLHttpRequest',\n        'Content-Type': 'application/json'\n      }\n      body = {\n        'tags': {\n          'names': ['Q1 2024', 'Reviewed', 'Priority'],\n          'overwrite': False\n        }\n      }\n      response = requests.patch(url, headers=headers, json=body)\n      response.json()"
      - lang: csharp
        label: CSharp
        source: "using RestSharp;\n      using Newtonsoft.Json;\n\n      var client = new RestClient(\"https://api.canoesoftware.com/\");\n      var request = new RestRequest(\"v1/documents/allocation_12345/allocation-tags\", Method.Patch);\n      request.AddParameter(\"Authorization\", string.Format(\"Bearer {token}\"), ParameterType.HttpHeader);\n      request.AddHeader(\"Accept\", \"application/json\");\n      request.AddHeader(\"X-Requested-With\", \"XMLHttpRequest\");\n      request.AddHeader(\"Content-Type\", \"application/json\");\n      var body = new\n      {\n        tags = new\n        {\n          names = new[] { \"Q1 2024\", \"Reviewed\", \"Priority\" },\n          overwrite = false\n        }\n      };\n      request.AddJsonBody(body);\n      var response = client.Execute(request);\n      Console.WriteLine(response.Content);"
