  /v1/documents/metadata:
    post:
      tags:
      - Documents
      summary: Bulk Set Document Metadata
      description: Update metadata fields for up to 100 documents in a single request. Processing continues even if individual documents fail.
      operationId: BulkSetDocumentMetadata
      parameters:
      - name: document_ids
        in: body
        description: Array of document IDs to update. Maximum 100 per request.
        required: true
        schema:
          type: array
          example:
            document_ids:
            - document_1
            - document_2
      - name: approval_status
        in: body
        description: Set the approval status for all specified documents. Valid values are Approved, Flagged, Ignored, Pending.
        required: false
        schema:
          type: string
          example:
            approval_status: Approved
      - name: comment
        in: body
        description: Set the internal comment for all specified documents.
        required: false
        schema:
          type: string
          example:
            comment: Reviewed and approved.
      - name: tags
        in: body
        description: Set or append document tags. Provide names array and optional overwrite flag.
        required: false
        schema:
          type: object
          example:
            tags:
              names:
              - TagA
              - TagB
              overwrite: true
      - name: client_document_id
        in: body
        description: Set the client document ID for all specified documents.
        required: false
        schema:
          type: string
          example:
            client_document_id: CLIENT-REF-001
      responses:
        '200':
          description: Returns summary with total, successful, failed counts and per-document results.
        '422':
          description: Validation error — invalid request body (returned before processing starts).
      security:
      - bearerAuth: []
    servers:
    - url: https://api.canoesoftware.com
      description: Production API
  /v1/documents/{id}/metadata:
    put:
      tags:
      - Documents
      summary: Set Document Metadata
      description: Set document metadata.
      operationId: SetDocumentMetadata
      parameters:
      - name: id
        in: path
        description: The id of the document to be updated.
        required: true
        schema:
          type: string
          example: '1'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_status:
                  type: string
                  description: The new approval status to be changed on the document.
                  example: Approved
                comment:
                  type: string
                  description: The comment on the document.
                  example: Sample Comment.
                tags:
                  type: string
                  description: Tags to be applied to the document. Set `overwrite` to true to remove pre-existing tags.
                  example:
                    names: []
                    overwrite: false
                tags.names:
                  type: string
                  description: The array of tag names to apply to the document.
                  example:
                    names: []
                    overwrite: false
                tags.overwrite:
                  type: boolean
                  description: A boolean indicating whether pre-existing tags should be detached.
                  example:
                    names: []
                    overwrite: false
                client_document_id:
                  type: string
                  description: The custom document ID.
                  example: custom_document_id.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
