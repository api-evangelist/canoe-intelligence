  Bulk Set Document Metadata:
    post:
      tags:
      - Documents
      summary: null
      description: '/v1/documents/metadata


        Update metadata fields for up to 100 documents in a single request.

        Processing continues even if individual documents fail. Returns a summary

        of successful and failed updates.

        '
      operationId: BulkSetDocumentMetadata
      parameters:
      - name: document_ids
        in: body
        description: Array of document IDs to update. Maximum 100 per request.
        required: true
        schema:
          type: array
          example:
            document_ids:
            - document_1
            - document_2
      - name: approval_status
        in: body
        description: Set the approval status for all specified documents. Valid values are Approved, Flagged, Ignored, Pending.
        required: false
        schema:
          type: string
          example:
            approval_status: Approved
      - name: comment
        in: body
        description: Set the internal comment for all specified documents.
        required: false
        schema:
          type: string
          example:
            comment: Reviewed and approved.
      - name: tags
        in: body
        description: Set or append document tags. Provide names array and optional overwrite flag. If overwrite is true, existing tags are replaced.
        required: false
        schema:
          type: object
          example:
            tags:
              names:
              - TagA
              - TagB
              overwrite: true
      - name: client_document_id
        in: body
        description: Set the client document ID for all specified documents.
        required: false
        schema:
          type: string
          example:
            client_document_id: CLIENT-REF-001
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: "-\n      curl -X POST \\\n          \"https://api.canoesoftware.com/v1/documents/metadata\" \\\n          -H \"Authorization: Bearer {token}\" \\\n          -H \"Accept: application/json\" \\\n          -H \"X-Requested-With: XMLHttpRequest\" \\\n          -H \"Content-Type: application/json\" \\\n          -d '{\"document_ids\":[\"document_1\",\"document_2\"],\"approval_status\":\"Approved\",\"comment\":\"Reviewed.\",\"tags\":{\"names\":[\"TagA\"],\"overwrite\":false}}'\n"
                summary: Bash
              Javascript:
                description: "-\n      const url = new URL(\n          \"https://api.canoesoftware.com/v1/documents/metadata\"\n      );\n\n      let headers = {\n          \"Authorization\": \"Bearer {token}\",\n          \"Accept\": \"application/json\",\n          \"X-Requested-With\": \"XMLHttpRequest\",\n          \"Content-Type\": \"application/json\",\n      };\n\n      let body = {\n          \"document_ids\": [\"document_1\", \"document_2\"],\n          \"approval_status\": \"Approved\",\n          \"comment\": \"Reviewed.\",\n          \"tags\": {\n              \"names\": [\"TagA\"],\n              \"overwrite\": false\n          }\n      }\n\n      fetch(url, {\n          method: \"POST\",\n          headers: headers,\n          body: JSON.stringify(body)\n      })\n          .then(response => response.json())\n          .then(json => console.log(json));\n"
                summary: JavaScript
              PHP:
                description: "-\n      $client = new \\GuzzleHttp\\Client();\n      $response = $client->post(\n          'https://api.canoesoftware.com/v1/documents/metadata',\n          [\n              'headers' => [\n                  'Authorization' => 'Bearer {token}',\n                  'Accept' => 'application/json',\n                  'X-Requested-With' => 'XMLHttpRequest',\n                  'Content-Type' => 'application/json',\n              ],\n              'json' => [\n                  'document_ids' => ['document_1', 'document_2'],\n                  'approval_status' => 'Approved',\n                  'comment' => 'Reviewed.',\n                  'tags' => [\n                      'names' => ['TagA'],\n                      'overwrite' => false,\n                  ],\n              ],\n          ]\n      );\n      $body = $response->getBody();\n      print_r(json_decode((string) $body));\n"
                summary: PHP
              Python:
                description: "-\n      import requests\n      import json\n\n      url = 'https://api.canoesoftware.com/v1/documents/metadata'\n      payload = {\n          \"document_ids\": [\"document_1\", \"document_2\"],\n          \"approval_status\": \"Approved\",\n          \"comment\": \"Reviewed.\",\n          \"tags\": {\n              \"names\": [\"TagA\"],\n              \"overwrite\": false\n          }\n      }\n      headers = {\n        'Authorization': 'Bearer {token}',\n        'Accept': 'application/json',\n        'X-Requested-With': 'XMLHttpRequest',\n        'Content-Type': 'application/json'\n      }\n      response = requests.request('POST', url, headers=headers, json=payload)\n      response.json()\n"
                summary: Python
              CSharp:
                description: "-\n      using RestSharp;\n\n      var client = new RestClient(\"https://api.canoesoftware.com/\");\n      var request = new RestRequest(\"v1/documents/metadata\", Method.Post);\n      request.AddParameter(\"Authorization\", string.Format(\"Bearer {token}\"), ParameterType.HttpHeader);\n      request.AddHeader(\"Accept\", \"application/json\");\n      request.AddHeader(\"X-Requested-With\", \"XMLHttpRequest\");\n      request.AddHeader(\"Content-Type\", \"application/json\");\n      var body = new\n      {\n          document_ids = new [] { \"document_1\", \"document_2\" },\n          approval_status = \"Approved\",\n          comment = \"Reviewed.\",\n          tags = new { names = new [] { \"TagA\" }, overwrite = false }\n      };\n      request.AddJsonBody(body);\n      var response = client.Execute(request);\n      Console.WriteLine(response.Content);\n"
                summary: CSharp
      responses:
        '200':
          description: Returns summary with total, successful, failed counts and per-document results.
        '422':
          description: Validation error — invalid request body (returned before processing starts).
