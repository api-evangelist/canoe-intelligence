  Download Documents:
    get:
      tags:
      - Documents
      summary: null
      description: '/v1/documents


        Download documents in a ZIP file. Each fetch will download up to 100 documents. By default, this will fetch the first 100 documents in the Intelligent Document Center. A successful call to this endpoint will only contain the binary file and not the JSON data.


        To retrieve additional information, you can inspect the response header data. There, you can find the total number of documents filtered by current query parameters.

        '
      operationId: DownloadDocuments
      parameters:
      - name: page
        in: query
        description: This page number. For example, if you specify "2" you will see all documents on page 2. By default, this is set to 1. Example:- 1
        required: false
        schema:
          type: integer
        examples:
          page 1:
            value: 1
          page 5:
            value: 5
      - name: limit
        in: query
        description: The number of documents for each page. The maximum number of documents limit is 100. Example:- 50
        required: false
        schema:
          type: integer
        examples:
          limit:
            value: 50
      - name: fields
        in: query
        description: The fields you need in the partial response. The value of the fields parameter MUST be a comma-separated (U+002C COMMA, ",") list that refers to the name(s) of the fields to be returned.
        required: false
        schema:
          type: string
        examples:
          fields:
            value: name,validated_data
      - name: document_id
        in: query
        description: The IDs of the documents in Canoe.
        required: false
        schema:
          type: string
        examples:
          document_id:
            value: document_1,document_2
      - name: client_document_id
        in: query
        description: The custom document IDs.
        required: false
        schema:
          type: string
        examples:
          client_document_id:
            value: client_document_id
      - name: fund_id
        in: query
        description: The IDs of funds in Canoe. To retrieve these, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          fund_id:
            value: fund_1,fund_2
      - name: account_id
        in: query
        description: The IDs of accounts in Canoe. To retrieve these, use the <code>v1/organizations?type=account</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          account_id:
            value: account_1,account_2
      - name: investment_entity_id
        in: query
        description: The IDs of investment entities in Canoe. To retrieve these, use the <code>v1/organizations?type=entity</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          investment_entity_id:
            value: entity_1,entity_2
      - name: document_type
        in: query
        description: The document types. To retrieve these, use the <code>v1/documents/types</code> <a href="#operations-Documents-GetDocumentsType"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          document_type:
            value: Account Statement,Capital Call Notice
      - name: fund_sponsor
        in: query
        description: The Fund Sponsors. The entered Fund Sponsors must be an exact match, although all query parameters are case-insensitive.
        required: false
        schema:
          type: string
        examples:
          fund_sponsor_multiple:
            value: fund_sponsor_1,fund_sponsor_2
          fund_sponsor_single:
            value: fund_sponsor_1
      - name: data_date_start
        in: query
        description: All documents returned will have data date <strong>greater than or equal to</strong> the given data_date_start. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          data_date_start:
            value: '2019-03-30'
      - name: data_date_end
        in: query
        description: All documents returned will have data date <strong>less than or equal to</strong> the given data_date_end. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          data_date_end:
            value: '2019-03-30'
      - name: document_status
        in: query
        description: This is the validation status determined by Canoe. For example, Complete means that Canoe has successfully categorized, recognized, extracted, and validated data from the document.<br><br>Our current statuses are:<br><br><li>Complete</li><br><li>Potential Discrepancy</li><br><li>Duplicate</li><br><li>Password Protected</li><br><li>Configuration Required</li><br><li>Unsupported Formats</li><br><li>Anomaly Detected</li><br><li>Awaiting Confirmation</li><br><li>Storage Only</li><br><br>A misspelled status will return an empty array.
        required: false
        schema:
          type: string
        examples:
          document_status:
            value: Complete,Storage Only
      - name: document_source
        in: query
        description: The method of document ingestion. These sources are:<br><br><li>Upload Engine</li><br><li>Email</li><br><li>Intralinks</li><br><li>API</li>
        required: false
        schema:
          type: string
        examples:
          document_source:
            value: Email,Upload Engine
      - name: skip_downloaded
        in: query
        description: Setting to true excludes documents from the response that have previously been downloaded through the API for the document allocations that match the call's other request parameters. The default value is false.
        required: false
        schema:
          type: string
        examples:
          skip_downloaded:
            value: false
      - name: document_tag_id
        in: query
        description: The IDs of tags in Canoe. To retrieve these, use the <code>v1/documents/tags</code> <a href="#get-document-tags"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          document_tag_id:
            value: tag_1,tag_2
      - name: file_upload_time_start
        in: query
        description: All documents downloaded will have an uploaded timestamp <strong>greater than or equal to</strong> the given file_upload_time_start. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents uploaded on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          file_upload_time_start:
            value: '2019-03-30T04:00:00Z'
      - name: file_upload_time_end
        in: query
        description: All documents downloaded will have an uploaded timestamp <strong>less than or equal to</strong> the given file_upload_time_end. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents uploaded on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          file_upload_time_end:
            value: '2019-03-31T04:00:00Z'
      - name: account_group
        in: query
        description: The Account Group the documents belong to.
        required: false
        schema:
          type: string
        examples:
          account_group:
            value: 'Geography: North America,Geography: Europe'
      - name: last_modified_time_start
        in: query
        description: All documents returned will have a last updated timestamp <strong>greater than or equal to</strong> the given last_modified_time_start. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents updated on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          last_modified_time_start:
            value: '2019-03-30T04:00:00Z'
      - name: last_modified_time_end
        in: query
        description: All documents returned will have a last updated timestamp <strong>less than or equal to</strong> the given last_modified_time_end. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents updated on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          last_modified_time_end:
            value: '2019-07-31T04:00:00Z'
      - name: is_locked
        in: query
        description: The is_locked status of the document in Canoe. Accepted values are either true or false. The default is false.
        required: false
        schema:
          type: string
        examples:
          is_locked:
            value: false
      - name: file_name_type
        in: query
        description: The document name format to return for each document.  The available options are name, original_file_name and id.  The default value for this is name, which is your tenant's custom "Document Name Format" specified in the Intelligent Document Center.  original_file_name returns the name of the file as it appeared when loaded into Canoe.  id returns the documentâ€™s Canoe Document Identifier.
        required: false
        schema:
          type: string
        examples:
          file_name_type:
            value: original_file_name
      - name: ready_for_extract
        in: query
        description: The extraction status of the document in Canoe. Accepted values are either true or false. The default is false.
        required: false
        schema:
          type: string
        examples:
          ready_for_extract:
            value: false
      - name: approval_status
        in: query
        description: The approval status of the documents in Canoe. If searching for multiple statuses, they should be separated by commas. Valid statuses are:<br><br><li>Approved</li><br><li>Flagged</li><br><li>Ignored</li><br><li>Pending</li>
        required: false
        schema:
          type: string
        examples:
          approval_status:
            value: Approved
      - name: approved_by
        in: query
        description: The User ID of the approver of the documents in Canoe.
        required: false
        schema:
          type: string
        examples:
          approved_by:
            value: user_1,user_2
      - name: approval_date_start
        in: query
        description: All documents returned will have an approval date <strong>greater than or equal to</strong> the given approval_date_start. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          approval_date_start:
            value: '2019-03-30'
      - name: approval_date_end
        in: query
        description: All documents returned will have an approval date <strong>less than or equal to</strong> the given approval_date_end. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          approval_date_end:
            value: '2019-03-31'
      - name: assignee
        in: query
        description: The User ID of the assignee for the document in Canoe. If searching for multiple assignees, they should be separated by commas. Example:- user_1,user_2
        required: false
        schema:
          type: string
        examples:
          approved_by:
            value: user_1,user_2
      - name: uploaded_by
        in: query
        description: The full name of the user who uploaded the document. If searching for multiple users, they should be separated by commas. Use 'Canoe Connect System User' to filter for documents uploaded via Canoe Connect. Example:- John Smith,John Doe
        required: false
        schema:
          type: string
        examples:
          uploaded_by:
            value: John Smith,John Doe
      - name: not_document_tag_id
        in: query
        description: The IDs of tags in Canoe. To retrieve these, use the <code>v1/documents/tags</code> <a href="#get-document-tags">endpoint</a>. This will search for documents that have NOT been tagged with a specified tag.
        required: false
        schema:
          type: string
        examples:
          approved_by:
            value: tag_1,tag_2
      - name: category
        in: query
        description: The category of the document. Our current categories are:<br><br><li>Capital Activity</li><br><li>Email & System Messages</li><br><li>Financial Statements & Performance</li><br><li>Investment & Transactional</li><br><li>Investor Administration & Communication</li><br><li>Legal, Compliance & Regulatory</li><br><li>Other</li><br><li>Tax</li><br><br>Multiple categories can be passed as a comma-delimited list (e.g. <code>Capital Activity,Tax</code>).
        required: false
        schema:
          type: string
        examples:
          category:
            value: Capital Activity, Email
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: "-\n      curl -X GET \\\n          -G \"https://api.canoesoftware.com/v1/documents?page=1&limit=50&document_id=document_1%2Cdocument_2&client_document_id=custom_id_16%2Ccustom_id_17&fund_id=fund_1%2Cfund_2&account_id=account_1%2Caccount_2&investment_entity_id=entity_1%2Centity_2&document_type=Account+Statement%2CCapital+Call+Notice&fund_sponsor=fund_sponsor_1%2Cfund_sponsor_2&data_date_start=2019-03-30&data_date_end=2019-07-31&document_status=Complete%2CStorage+Only&document_source=Email%2CUpload+Engine&document_tag_id=tag_1%2Ctag_2&file_upload_time_start=2019-03-30T04%3A00%3A00Z&file_upload_time_end=2019-07-31T04%3A00%3A00Z&last_modified_time_start=2019-03-30T04%3A00%3A00Z&last_modified_time_end=2019-07-31T04%3A00%3A00Z&is_locked=false&ready_for_extract=true&approval_status=Approved&approved_by=user_1%2Cuser_2&approval_date_start=2019-03-30&approval_date_end=2019-07-31&account_group=Geography%3A+North+America%2CGeography%3A+Europe&skip_downloaded=false&file_name_type=original_file_name&category=Capital%20Activity\" \\\n          -H \"Authorization: Bearer {token}\" \\\n          -H \"Accept: application/json\" \\\n          -H \"X-Requested-With: XMLHttpRequest\"\n"
                summary: Bash
              Javascript:
                description: "-\n      const url = new URL(\n          \"https://api.canoesoftware.com/v1/documents\"\n      );\n\n      let params = {\n          \"page\": \"1\",\n          \"limit\": \"50\",\n          \"document_id\": \"document_1,document_2\",\n          \"client_document_id\": \"custom_id_16,custom_id_17\",\n          \"fund_id\": \"fund_1,fund_2\",\n          \"account_id\": \"account_1,account_2\",\n          \"investment_entity_id\": \"entity_1,entity_2\",\n          \"document_type\": \"Account Statement,Capital Call Notice\",\n          \"fund_sponsor\": \"fund_sponsor_1,fund_sponsor_2\",\n          \"data_date_start\": \"2019-03-30\",\n          \"data_date_end\": \"2019-07-31\",\n          \"document_status\": \"Complete,Storage Only\",\n          \"document_source\": \"Email,Upload Engine\",\n          \"document_tag_id\": \"tag_1,tag_2\",\n          \"file_upload_time_start\": \"2019-03-30T04:00:00Z\",\n          \"file_upload_time_end\": \"2019-07-31T04:00:00Z\",\n          \"last_modified_time_start\": \"2019-03-30T04:00:00Z\",\n          \"last_modified_time_end\": \"2019-07-31T04:00:00Z\",\n          \"is_locked\": \"false\",\n          \"ready_for_extract\": \"true\",\n          \"approval_status\": \"Approved\",\n          \"approved_by\": \"user_1,user_2\",\n          \"approval_date_start\": \"2019-03-30\",\n          \"approval_date_end\": \"2019-07-31\",\n          \"account_group\": \"Geography: North America,Geography: Europe\",\n          \"skip_downloaded\": \"false\",\n          \"file_name_type\": \"original_file_name\",\n          \"category\": \"Capital Activity\"\n      };\n      Object.keys(params)\n          .forEach(key => url.searchParams.append(key, params[key]));\n\n      let headers = {\n          \"Authorization\": \"Bearer {token}\",\n          \"Accept\": \"application/json\",\n          \"X-Requested-With\": \"XMLHttpRequest\",\n          \"Content-Type\": \"application/json\",\n      };\n\n      fetch(url, {\n          method: \"GET\",\n          headers: headers,\n      })\n          .then(response => response.json())\n          .then(json => console.log(json));\n"
                summary: JavaScript
              PHP:
                description: "-\n      $client = new \\GuzzleHttp\\Client();\n      $response = $client->get(\n          'https://api.canoesoftware.com/v1/documents',\n          [\n              'headers' => [\n                  'Authorization' => 'Bearer {token}',\n                  'Accept' => 'application/json',\n                  'X-Requested-With' => 'XMLHttpRequest',\n              ],\n              'query' => [\n                  'page' => '1',\n                  'limit' => '50',\n                  'document_id' => 'document_1,document_2',\n                  'client_document_id' => 'custom_id_16,custom_id_17',\n                  'fund_id' => 'fund_1,fund_2',\n                  'account_id' => 'account_1,account_2',\n                  'investment_entity_id' => 'entity_1,entity_2',\n                  'document_type' => 'Account Statement,Capital Call Notice',\n                  'fund_sponsor' => 'fund_sponsor_1,fund_sponsor_2',\n                  'data_date_start' => '2019-03-30',\n                  'data_date_end' => '2019-07-31',\n                  'document_status' => 'Complete,Storage Only',\n                  'document_source' => 'Email,Upload Engine',\n                  'document_tag_id' => 'tag_1,tag_2',\n                  'file_upload_time_start' => '2019-03-30T04:00:00Z',\n                  'file_upload_time_end' => '2019-07-31T04:00:00Z',\n                  'last_modified_time_start' => '2019-03-30T04:00:00Z',\n                  'last_modified_time_end' => '2019-07-31T04:00:00Z',\n                  'is_locked' => 'false',\n                  'ready_for_extract' => 'true',\n                  'approval_status' => 'Approved',\n                  'approved_by' => 'user_1,user_2',\n                  'approval_date_start' => '2019-03-30',\n                  'approval_date_end' => '2019-07-31',\n                  'account_group' => 'Geography: North America,Geography: Europe',\n                  'skip_downloaded' => 'false',\n                  'file_name_type' => 'original_file_name',\n                  'category'=> 'Capital Activity'\n              ],\n          ]\n      );\n      $body = $response->getBody();\n      print_r(json_decode((string) $body));\n"
                summary: PHP
              Python:
                description: "-\n      import requests\n      import json\n\n      url = 'https://api.canoesoftware.com/v1/documents'\n      params = {\n        'page': '1',\n        'limit': '50',\n        'document_id': 'document_1,document_2',\n        'client_document_id': 'custom_id_16,custom_id_17',\n        'fund_id': 'fund_1,fund_2',\n        'account_id': 'account_1,account_2',\n        'investment_entity_id': 'entity_1,entity_2',\n        'document_type': 'Account Statement,Capital Call Notice',\n        'fund_sponsor': 'fund_sponsor_1,fund_sponsor_2',\n        'data_date_start': '2019-03-30',\n        'data_date_end': '2019-07-31',\n        'document_status': 'Complete,Storage Only',\n        'document_source': 'Email,Upload Engine',\n        'document_tag_id': 'tag_1,tag_2',\n        'file_upload_time_start': '2019-03-30T04:00:00Z',\n        'file_upload_time_end': '2019-07-31T04:00:00Z',\n        'last_modified_time_start': '2019-03-30T04:00:00Z',\n        'last_modified_time_end': '2019-07-31T04:00:00Z',\n        'is_locked': 'false',\n        'ready_for_extract': 'true',\n        'approval_status': 'Approved',\n        'approved_by': 'user_1,user_2',\n        'approval_date_start': '2019-03-30',\n        'approval_date_end': '2019-07-31',\n        'account_group': 'Geography: North America,Geography: Europe',\n        'skip_downloaded': 'false',\n        'file_name_type': 'original_file_name',\n        'category'=> 'Capital Activity'\n      }\n      headers = {\n        'Authorization': 'Bearer {token}',\n        'Accept': 'application/json',\n        'X-Requested-With': 'XMLHttpRequest'\n      }\n      response = requests.request('GET', url, headers=headers)\n      response.json()\n"
                summary: Python
              CSharp:
                description: "-\n      using RestSharp;\n\n      var client = new RestClient(\"https://api.canoesoftware.com/\");\n      var request = new RestRequest(\"v1/documents\", Method.Get);\n      request.AddParameter(\"Authorization\", string.Format(\"Bearer {token}\"), ParameterType.HttpHeader);\n      request.AddHeader(\"Accept\", \"application/json\");\n      request.AddHeader(\"X-Requested-With\", \"XMLHttpRequest\");\n      request.AddQueryParameter(\"page\", \"1\");\n      request.AddQueryParameter(\"limit\", \"50\");\n      request.AddQueryParameter(\"document_id\", \"document_1,document_2\");\n      request.AddQueryParameter(\"client_document_id\", \"custom_id_16,custom_id_17\");\n      request.AddQueryParameter(\"fund_id\", \"fund_1,fund_2\");\n      request.AddQueryParameter(\"account_id\", \"account_1,account_2\");\n      request.AddQueryParameter(\"investment_entity_id\", \"entity_1,entity_2\");\n      request.AddQueryParameter(\"document_type\", \"Account Statement,Capital Call Notice\");\n      request.AddQueryParameter(\"fund_sponsor\", \"fund_sponsor_1,fund_sponsor_2\");\n      request.AddQueryParameter(\"data_date_start\", \"2019-03-30\");\n      request.AddQueryParameter(\"data_date_end\", \"2019-07-31\");\n      request.AddQueryParameter(\"document_status\", \"Complete,Storage Only\");\n      request.AddQueryParameter(\"document_source\", \"Email,Upload Engine\");\n      request.AddQueryParameter(\"document_tag_id\", \"tag_1,tag_2\");\n      request.AddQueryParameter(\"file_upload_time_start\", \"2019-03-30T04:00:00Z\");\n      request.AddQueryParameter(\"file_upload_time_end\", \"2019-07-31T04:00:00Z\");\n      request.AddQueryParameter(\"last_modified_time_start\", \"2019-03-30T04:00:00Z\");\n      request.AddQueryParameter(\"last_modified_time_end\", \"2019-07-31T04:00:00Z\");\n      request.AddQueryParameter(\"is_locked\", \"false\");\n      request.AddQueryParameter(\"ready_for_extract\", \"true\");\n      request.AddQueryParameter(\"approval_status\", \"Approved\");\n      request.AddQueryParameter(\"approved_by\", \"user_1,user_2\");\n      request.AddQueryParameter(\"approval_date_start\", \"2019-03-30\");\n      request.AddQueryParameter(\"approval_date_end\", \"2019-07-31\");\n      request.AddQueryParameter(\"account_group\", \"Geography: North America,Geography: Europe\");\n      request.AddQueryParameter(\"skip_downloaded\", \"false\");\n      request.AddQueryParameter(\"file_name_type\", \"original_file_name\");\n      request.AddQueryParameter(\"category\", \"Capital Activity\");\n      var response = client.Execute(request);\n      foreach (var h in response.ContentHeaders) {\n          if (h.Name==\"Content-Disposition\") {\n              var disposition = h.Value.ToString();\n              var filename = disposition.Substring(disposition.IndexOf(\"filename=\") + \"filename=\".Length);\n              File.WriteAllBytes(filename, response.RawBytes);\n          }\n      }\n"
                summary: CSharp
      responses:
        '200':
          description: Success
  Upload A Single Document:
    post:
      tags:
      - Documents
      summary: null
      description: '/v1/documents


        Upload a Single Document

        '
      operationId: UploadDocuments
      parameters:
      - name: file
        in: body
        description: The file you would like to upload to Canoe. This supports only one file per request. If you send multiple files through a single request, only first file will be taken. If you are including a non-PDF document, please make sure your tenant is enabled for these extensions before attempting upload.
        required: true
        schema:
          type: file
          example:
            file: ab
      - name: storage_only
        in: body
        description: Whether you want the uploaded file to be extracted. If it's set to true, it will not be extracted nor validated by Canoe. The default value for this is false.
        required: false
        schema:
          type: boolean
          example:
            storage_only: true
      - name: term_id
        in: body
        description: The term's ID you would like to associate the document with. This is <strong>required</strong> if storage_only is set to true. To retrieve term IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
          example:
            term_id: term_1
      - name: organization_id
        in: body
        description: This is the entity or account ID you would like to associate the document with. It's <strong>required</strong> if storage_only is set to true and the document type you specified is one of the client document types. It's not required if storage_only is set to true and the document type you specified is one of the general document types. To retrieve these, use the <code>v1/organizations</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
          example:
            organization_id: document_1,document_2
      - name: document_type_id
        in: body
        description: The document type you would like to associate the document with. It's <strong>required</strong> if storage_only is set to true. To retrieve these IDs, use the <code>v1/documents/types</code> <a href="#operations-Documents-GetDocumentsType"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
          example:
            document_type_id: document_1,document_2
      - name: client_document_id
        in: body
        description: The custom document ID you'd like to associate the document with. This must be a unique ID within your account; multiple documents cannot share the same ID.
        required: false
        schema:
          type: string
          example:
            document_type_id: 123,124
      - name: allocation_id
        in: body
        description: The ID of an existing investment (allocation) in Canoe to pre-seed categorization attributes. When provided, the document will be automatically associated with the investment's fund, entity, and term. This allows categorization to be seeded at upload time without a separate API call. To retrieve investment IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
          example:
            allocation_id: allocation_1
      - name: data_date
        in: body
        description: The data date to associate with the document, in <code>YYYY-MM-DD</code> format. Used to pre-seed the data date attribute during upload.
        required: false
        schema:
          type: string
          example:
            data_date: '2024-03-31'
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: "-\n      curl -X POST \\\n          \"https://api.canoesoftware.com/v1/documents\" \\\n          -H \"Authorization: Bearer {token}\" \\\n          -H \"Accept: application/json\" \\\n          -H \"X-Requested-With: XMLHttpRequest\" \\\n          -H \"Content-Type: application/json\" \\\n          -d '{\"file\":\"ab\",\"storage_only\":true,\"term_id\":\"term_1\",\"organization_id\":\"organization_1\",\"document_type_id\":\"term_sheet_id\",\"client_document_id\":\"123\",\"allocation_id\":\"allocation_1\",\"data_date\":\"2024-03-31\"}'\n"
                summary: Bash
              Javascript:
                description: "-\n      const url = new URL(\n          \"https://api.canoesoftware.com/v1/documents\"\n      );\n\n      let headers = {\n          \"Authorization\": \"Bearer {token}\",\n          \"Accept\": \"application/json\",\n          \"X-Requested-With\": \"XMLHttpRequest\",\n          \"Content-Type\": \"application/json\",\n      };\n\n      let body = {\n          \"file\": \"ab\",\n          \"storage_only\": true,\n          \"term_id\": \"term_1\",\n          \"organization_id\": \"organization_1\",\n          \"document_type_id\": \"term_sheet_id\",\n          \"client_document_id\": \"123\",\n          \"allocation_id\": \"allocation_1\",\n          \"data_date\": \"2024-03-31\"\n      }\n\n      fetch(url, {\n          method: \"POST\",\n          headers: headers,\n          body: body\n      })\n          .then(response => response.json())\n          .then(json => console.log(json));\n"
                summary: JavaScript
              PHP:
                description: "-\n      $client = new \\GuzzleHttp\\Client();\n      $response = $client->post(\n          'https://api.canoesoftware.com/v1/documents',\n          [\n              'headers' => [\n                  'Authorization' => 'Bearer {token}',\n                  'Accept' => 'application/json',\n                  'X-Requested-With' => 'XMLHttpRequest',\n                  'Content-Type' => 'application/json',\n              ],\n              'json' => [\n                  'file' => 'ab',\n                  'storage_only' => true,\n                  'term_id' => 'term_1',\n                  'organization_id' => 'organization_1',\n                  'document_type_id' => 'term_sheet_id',\n                  'client_document_id' => '123',\n                  'allocation_id' => 'allocation_1',\n                  'data_date' => '2024-03-31',\n              ],\n          ]\n      );\n      $body = $response->getBody();\n      print_r(json_decode((string) $body));\n"
                summary: PHP
              Python:
                description: "-\n      import requests\n      import json\n\n      url = 'https://api.canoesoftware.com/v1/documents'\n      payload = {\n          \"file\": \"ab\",\n          \"storage_only\": true,\n          \"term_id\": \"term_1\",\n          \"organization_id\": \"organization_1\",\n          \"document_type_id\": \"term_sheet_id\",\n          \"client_document_id\": \"123\",\n          \"allocation_id\": \"allocation_1\",\n          \"data_date\": \"2024-03-31\"\n      }\n      headers = {\n        'Authorization': 'Bearer {token}',\n        'Accept': 'application/json',\n        'X-Requested-With': 'XMLHttpRequest',\n        'Content-Type': 'application/json'\n      }\n      response = requests.request('POST', url, headers=headers, json=payload)\n      response.json()\n"
                summary: Python
              CSharp:
                description: "-\n      using RestSharp;\n\n      var client = new RestClient(\"https://api.canoesoftware.com/\");\n      var request = new RestRequest(\"v1/documents\", Method.Post);\n      request.AddParameter(\"Authorization\", string.Format(\"Bearer {token}\"), ParameterType.HttpHeader);\n      request.AddHeader(\"Accept\", \"application/json\");\n      request.AddHeader(\"X-Requested-With\", \"XMLHttpRequest\");\n      request.AddHeader(\"Content-Type\", \"multipart/form-data\");\n      request.AddFile(\"file\",\"path_to_file\");\n      var body = new\n      {\n          storage_only = \"1\",\n          term_id = \"term_id\",\n          organization_id = \"organization_1\",\n          term_sheet_id = \"term_sheet_id\"\n          client_document_id = \"123\",\n          allocation_id = \"allocation_1\",\n          data_date = \"2024-03-31\",\n      };\n      request.AddJsonBody(body);\n      var response = client.Execute(request);\n      Console.WriteLine(response.Content);\n"
                summary: CSharp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadSingleDocument'
        '422':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  example:
                    errors:
                      file:
                      - 'The file must be a file of type: pdf.'
                      document_type_id:
                      - The document_type_id field is required for storage only upload.
                      term_id:
                      - The term_id field is required for storage only upload.
  Edit Document Attributes:
    put:
      tags:
      - Documents
      summary: null
      description: "/v1/documents/edit-attributes\n\nUpdate categorization attributes for up to 100 documents in a single request. At least one of the following fields must be provided: <code>allocation_id</code>, <code>entity_id</code>, <code>term_id</code>, <code>data_date</code>, or <code>document_type_id</code>.\n\nThe allocation can be specified in two ways:\n<ul>\n  <li>By <code>allocation_id</code> — directly identifies an existing investment. This derives the associated fund, entity, and term automatically.</li>\n  <li>By <code>term_id</code> + <code>entity_id</code> — must correspond to an existing investment record.</li>\n</ul>\n"
      operationId: EditDocumentAttributes
      parameters:
      - name: document_ids
        in: body
        description: An array of Canoe document IDs to update. At least 1 and at most 100 document IDs may be provided per request.
        required: true
        schema:
          type: array
          items:
            type: string
          example:
            document_ids:
            - document_1
            - document_2
      - name: allocation_id
        in: body
        description: The ID of an existing investment (allocation) in Canoe. When provided, the document will be associated with the investment's fund, entity, and term. Takes precedence over <code>term_id</code> + <code>entity_id</code> when both are supplied. To retrieve investment IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
          example:
            allocation_id: allocation_1
      - name: entity_id
        in: body
        description: The entity (investment entity) ID to associate the documents with. To retrieve these, use the <code>v1/organizations?type=entity</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>. If provided alongside <code>term_id</code> (without <code>allocation_id</code>), the combination must correspond to a valid investment.
        required: false
        schema:
          type: string
          example:
            entity_id: entity_1
      - name: term_id
        in: body
        description: The term ID to associate the documents with. To retrieve term IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>. If provided alongside <code>entity_id</code> (without <code>allocation_id</code>), the combination must correspond to a valid investment.
        required: false
        schema:
          type: string
          example:
            term_id: term_1
      - name: data_date
        in: body
        description: The data date to set on the document allocations, in <code>YYYY-MM-DD</code> format.
        required: false
        schema:
          type: string
          example:
            data_date: '2024-03-31'
      - name: document_type_id
        in: body
        description: The document type ID to assign to the documents. To retrieve valid document type IDs, use the <code>v1/documents/types</code> <a href="#operations-Documents-GetDocumentsType"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
          example:
            document_type_id: term_sheet_id
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: "-\n      curl -X PUT \\\n          \"https://api.canoesoftware.com/v1/documents/edit-attributes\" \\\n          -H \"Authorization: Bearer {token}\" \\\n          -H \"Accept: application/json\" \\\n          -H \"X-Requested-With: XMLHttpRequest\" \\\n          -H \"Content-Type: application/json\" \\\n          -d '{\"document_ids\":[\"document_1\",\"document_2\"],\"allocation_id\":\"allocation_1\",\"data_date\":\"2024-03-31\",\"document_type_id\":\"term_sheet_id\"}'\n"
                summary: Bash
              Javascript:
                description: "-\n      const url = new URL(\n          \"https://api.canoesoftware.com/v1/documents/edit-attributes\"\n      );\n\n      let headers = {\n          \"Authorization\": \"Bearer {token}\",\n          \"Accept\": \"application/json\",\n          \"X-Requested-With\": \"XMLHttpRequest\",\n          \"Content-Type\": \"application/json\",\n      };\n\n      let body = {\n          \"document_ids\": [\"document_1\", \"document_2\"],\n          \"allocation_id\": \"allocation_1\",\n          \"data_date\": \"2024-03-31\",\n          \"document_type_id\": \"term_sheet_id\"\n      }\n\n      fetch(url, {\n          method: \"PUT\",\n          headers: headers,\n          body: JSON.stringify(body)\n      })\n          .then(response => response.json())\n          .then(json => console.log(json));\n"
                summary: JavaScript
              PHP:
                description: "-\n      $client = new \\GuzzleHttp\\Client();\n      $response = $client->put(\n          'https://api.canoesoftware.com/v1/documents/edit-attributes',\n          [\n              'headers' => [\n                  'Authorization' => 'Bearer {token}',\n                  'Accept' => 'application/json',\n                  'X-Requested-With' => 'XMLHttpRequest',\n                  'Content-Type' => 'application/json',\n              ],\n              'json' => [\n                  'document_ids' => ['document_1', 'document_2'],\n                  'allocation_id' => 'allocation_1',\n                  'data_date' => '2024-03-31',\n                  'document_type_id' => 'term_sheet_id',\n              ],\n          ]\n      );\n      $body = $response->getBody();\n      print_r(json_decode((string) $body));\n"
                summary: PHP
              Python:
                description: "-\n      import requests\n      import json\n\n      url = 'https://api.canoesoftware.com/v1/documents/edit-attributes'\n      payload = {\n          \"document_ids\": [\"document_1\", \"document_2\"],\n          \"allocation_id\": \"allocation_1\",\n          \"data_date\": \"2024-03-31\",\n          \"document_type_id\": \"term_sheet_id\"\n      }\n      headers = {\n        'Authorization': 'Bearer {token}',\n        'Accept': 'application/json',\n        'X-Requested-With': 'XMLHttpRequest',\n        'Content-Type': 'application/json'\n      }\n      response = requests.request('PUT', url, headers=headers, json=payload)\n      response.json()\n"
                summary: Python
              CSharp:
                description: "-\n      using RestSharp;\n\n      var client = new RestClient(\"https://api.canoesoftware.com/\");\n      var request = new RestRequest(\"v1/documents/edit-attributes\", Method.Put);\n      request.AddParameter(\"Authorization\", string.Format(\"Bearer {token}\"), ParameterType.HttpHeader);\n      request.AddHeader(\"Accept\", \"application/json\");\n      request.AddHeader(\"X-Requested-With\", \"XMLHttpRequest\");\n      request.AddHeader(\"Content-Type\", \"application/json\");\n      var body = new\n      {\n          document_ids = new[] { \"document_1\", \"document_2\" },\n          allocation_id = \"allocation_1\",\n          data_date = \"2024-03-31\",\n          document_type_id = \"term_sheet_id\",\n      };\n      request.AddJsonBody(body);\n      var response = client.Execute(request);\n      Console.WriteLine(response.Content);\n"
                summary: CSharp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    description: IDs of documents that were successfully updated.
                    items:
                      type: string
                  failed:
                    type: array
                    description: Documents that could not be updated, with a reason for each failure.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The document ID that failed to update.
                        reason:
                          type: string
                          description: The reason the update failed.
              example:
                updated:
                - document_1
                - document_2
                failed:
                - id: document_3
                  reason: Document not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                example: At least one allocation field is required.
  /v1/documents/data:
    get:
      tags:
      - Documents
      summary: Get Document Data
      description: "Fetch documents' extracted data and metadata.\n\nBy default, Canoe's server sends back the full representation of each document object after processing requests.\nFor faster performance, you can use optional parameters to retrieve a subset of documents.\n\n<span name=\"doc-alert-info\">\nThis endpoint offers optional pagination. \nPagination supports the return of large results and is highly recommended for all use cases. \nUnpaginated calls will be depreciated in future versions of the Canoe API.\n<br><br>\nWhen using pagination, the response will contain headers defining the <code>total</code> number of results, \nas well as the <code>first</code>, <code>next</code>, <code>prev</code>, and <code>last</code> page responses for your result set. \nTo enable pagination pass a header parameter of X-API-VERSION with a value of 2022-09-19.\n</span>"
      operationId: GetDocuments
      parameters:
      - name: page
        in: query
        description: 'This page number. For example, if you specify "2" you will see all documents on page 2. By default, this is set to 1. <u>This parameter is only valid if the X-API-VERSION header is set to 2022-09-19.</u> Example: 1'
        required: false
        schema:
          type: integer
        examples:
          page 1:
            value: 1
          page 5:
            value: 5
      - name: limit
        in: query
        description: 'The number of documents for each page. The maximum number of documents limit is 100. <u>This parameter is only valid if the X-API-VERSION header is set to 2022-09-19.</u> Example: 50'
        required: false
        schema:
          type: integer
        examples:
          limit:
            value: 50
      - name: fields
        in: query
        description: The fields you need in the partial response. The value of the fields parameter MUST be a comma-separated (U+002C COMMA, ",") list that refers to the name(s) of the fields to be returned.
        required: false
        schema:
          type: string
        examples:
          fields:
            value: name,validated_data
      - name: allocation_id
        in: query
        description: The IDs of the allocations in Canoe.
        required: false
        schema:
          type: string
        examples:
          allocation_id single:
            value: allocation_1
          allocation_id multiple:
            value: allocation_1,allocation_2
      - name: document_id
        in: query
        description: The IDs of the documents in Canoe.
        required: false
        schema:
          type: string
        examples:
          document_id single:
            value: document_1
          document_id multiple:
            value: document_1,document_2
      - name: client_document_id
        in: query
        description: The custom document IDs.
        required: false
        schema:
          type: string
        examples:
          client_document_id:
            value: client_document_id
      - name: fund_id
        in: query
        description: The IDs of funds in Canoe. To retrieve these, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          fund_id single:
            value: fund_1
          fund_id multiple:
            value: fund_1,fund_2
      - name: account_id
        in: query
        description: The IDs of accounts in Canoe. To retrieve these, use the <code>v1/organizations?type=account</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          account_id single:
            value: account_1
          account_id multiple:
            value: account_1,account_2
      - name: investment_entity_id
        in: query
        description: The IDs of investment entities in Canoe. To retrieve these, use the <code>v1/organizations?type=entity</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          investment_entity_id single:
            value: entity_1
          investment_entity_id multiple:
            value: entity_1,entity_2
      - name: not_account_id
        in: query
        description: Exclude documents with the specified Account IDs. To retrieve Account IDs, use the <code>v1/accounts</code> <a href="#operations-Accounts-GetAccounts"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          not_account_id single:
            value: account_1
          not_account_id multiple:
            value: account_1,account_2
      - name: document_type
        in: query
        description: The document types. To retrieve these, use the <code>v1/documents/types</code> <a href="#operations-Documents-GetDocumentsType"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          document_type single:
            value: Account Statement
          document_type multiple:
            value: Account Statement,Capital Call Notice
      - name: fund_sponsor
        in: query
        description: The Fund Sponsors. The entered Fund Sponsors must be an exact match, although all query parameters are case-insensitive.
        required: false
        schema:
          type: string
        examples:
          fund_sponsor multiple:
            value: fund_sponsor_1,fund_sponsor_2
          fund_sponsor single:
            value: fund_sponsor_1
      - name: data_date_start
        in: query
        description: All documents returned will have data date <strong>greater than or equal to</strong> the given data_date_start. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          data_date_start:
            value: '2019-03-30'
      - name: data_date_end
        in: query
        description: All documents returned will have data date <strong>less than or equal to</strong> the given data_date_end. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          data_date_end:
            value: '2019-03-30'
      - name: document_status
        in: query
        description: This is the validation status determined by Canoe. For example, Complete means that Canoe has successfully categorized, recognized, extracted, and validated data from the document.<br><br>Our current statuses are:<br><br><li>Complete</li><br><li>Potential Discrepancy</li><br><li>Duplicate</li><br><li>Password Protected</li><br><li>Configuration Required</li><br><li>Unsupported Formats</li><br><li>Anomaly Detected</li><br><li>Awaiting Confirmation</li><br><li>Storage Only</li><br><br>A misspelled status will return an empty array.
        required: false
        schema:
          type: string
        examples:
          document_status:
            value: Complete,Storage Only
      - name: document_source
        in: query
        description: The method of document ingestion. These sources are:<br><br><li>Upload Engine</li><br><li>Email</li><br><li>Intralinks</li><br><li>API</li>
        required: false
        schema:
          type: string
        examples:
          document_source:
            value: Email,Upload Engine
      - name: document_tag_id
        in: query
        description: The IDs of tags in Canoe. To retrieve these, use the <code>v1/documents/tags</code> <a href="#get-document-tags"><u>endpoint</u></a>.
        required: false
        schema:
          type: string
        examples:
          document_tag_id:
            value: tag_1,tag_2
      - name: file_upload_time_start
        in: query
        description: All documents downloaded will have an uploaded timestamp <strong>greater than or equal to</strong> the given file_upload_time_start. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents uploaded on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          file_upload_time_start:
            value: '2019-03-30T04:00:00Z'
      - name: file_upload_time_end
        in: query
        description: All documents downloaded will have an uploaded timestamp <strong>less than or equal to</strong> the given file_upload_time_end. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents uploaded on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          file_upload_time_end:
            value: '2019-03-31T04:00:00Z'
      - name: account_group
        in: query
        description: The Account Group the documents belong to.
        required: false
        schema:
          type: string
        examples:
          account_group:
            value: 'Geography: North America,Geography: Europe'
      - name: last_modified_time_start
        in: query
        description: All documents returned will have a last updated timestamp <strong>greater than or equal to</strong> the given last_modified_time_start. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents updated on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          last_modified_time_start:
            value: '2019-03-30T04:00:00Z'
      - name: last_modified_time_end
        in: query
        description: All documents returned will have a last updated timestamp <strong>less than or equal to</strong> the given last_modified_time_end. Unless otherwise specified, the timestamp will be in EST (Eastern Standard Time). We suggest using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO 8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the time in Pacific Daylight Time; this will be automatically converted to EST. In this case, the user will receive the documents updated on or after 2019-09-19 at 03:00:00.
        required: false
        schema:
          type: string
        examples:
          last_modified_time_end:
            value: '2019-07-31T04:00:00Z'
      - name: is_locked
        in: query
        description: The is_locked status of the document in Canoe. Accepted values are either true or false. The default is false.
        required: false
        schema:
          type: string
        examples:
          is_locked:
            value: false
      - name: ready_for_extract
        in: query
        description: The extraction status of the document in Canoe. Accepted values are either true or false. The default is false.
        required: false
        schema:
          type: string
        examples:
          ready_for_extract:
            value: false
      - name: sum_values
        in: query
        description: Whether to return the sums of multi-data point fields in validated_data. Accepted values are either true or false. If it is set to false, multi-data points are returned as a list of values. The default is false.
        required: false
        schema:
          type: string
        examples:
          sum_values:
            value: false
      - name: approval_status
        in: query
        description: The approval status of the documents in Canoe. If searching for multiple statuses, they should be separated by commas. Valid statuses are:<br><br><li>Approved</li><br><li>Flagged</li><br><li>Ignored</li><br><li>Pending</li>
        required: false
        schema:
          type: string
        examples:
          approval_status:
            value: Approved
      - name: approved_by
        in: query
        description: The User ID of the approver of the documents in Canoe.
        required: false
        schema:
          type: string
        examples:
          approved_by:
            value: user_1,user_2
      - name: approval_date_start
        in: query
        description: All documents returned will have an approval date <strong>greater than or equal to</strong> the given approval_date_start. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          approval_date_start:
            value: '2019-03-30'
      - name: approval_date_end
        in: query
        description: All documents returned will have an approval date <strong>less than or equal to</strong> the given approval_date_end. This will be in EST (Eastern Standard Time).
        required: false
        schema:
          type: string
        examples:
          approval_date_end:
            value: '2019-03-31'
      - name: assignee
        in: query
        description: The User ID of the assignee for the document in Canoe. If searching for multiple assignees, they should be separated by commas. Example:- user_1,user_2
        required: false
        schema:
          type: string
        examples:
          approved_by:
            value: user_1,user_2
      - name: not_document_tag_id
        in: query
        description: The IDs of tags in Canoe. To retrieve these, use the <code>v1/documents/tags</code> <a href="#get-document-tags">endpoint</a>. This will search for documents that have NOT been tagged with a specified tag.
        required: false
        schema:
          type: string
        examples:
          approved_by:
            value: tag_1,tag_2
      - name: category
        in: query
        description: The category of the document. Our current categories are:<br><br><li>Capital Activity</li><br><li>Email & System Messages</li><br><li>Financial Statements & Performance</li><br><li>Investment & Transactional</li><br><li>Investor Administration & Communication</li><br><li>Legal, Compliance & Regulatory</li><br><li>Other</li><br><li>Tax</li><br><br>Multiple categories can be passed as a comma-delimited list (e.g. <code>Capital Activity,Tax</code>).
        required: false
        schema:
          type: string
        examples:
          category:
            value: Capital Activity,Email
      - name: downstream_ids
        in: query
        description: Filter documents by downstream system identifiers. Accepts an array of key-value pairs where the key represents the downstream system name and the value represents the identifier in that system. Multiple pairs can be provided to filter by multiple downstream systems.<u>This parameter is only valid if the X-API-VERSION header is set to 2022-09-19 and pagination is provided.</u>
