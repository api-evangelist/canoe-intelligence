                            .forEach(key => url.searchParams.append(key, params[key]));

                        let headers = {
                            "Authorization": "Bearer {token}",
                            "Accept": "application/json",
                            "X-Requested-With": "XMLHttpRequest",
                            "Content-Type": "application/json",
                        };

                        fetch(url, {
                            method: "GET",
                            headers: headers,
                        })
                            .then(response => response.json())
                            .then(json => console.log(json));
                summary: JavaScript
              PHP:
                description: |
                  -
                        $client = new \GuzzleHttp\Client();
                        $response = $client->get(
                            'https://api.canoesoftware.com/v1/funds/1/documents',
                            [
                                'headers' => [
                                    'Authorization' => 'Bearer {token}',
                                    'Accept' => 'application/json',
                                    'X-Requested-With' => 'XMLHttpRequest',
                                ],
                                'query' => [
                                    'start_time' => '2019-03-30T04:00:00Z',
                                    'page' => '1',
                                    'limit' => '50',
                                    'file_name_type' => 'original_file_name',
                                ],
                            ]
                        );
                        $body = $response->getBody();
                        print_r(json_decode((string) $body));
                summary: PHP
              Python:
                description: |
                  -
                        import requests
                        import json

                        url = 'https://api.canoesoftware.com/v1/funds/1/documents'
                        params = {
                          'start_time': '2019-03-30T04:00:00Z',
                          'page': '1',
                          'limit': '50',
                          'file_name_type': 'original_file_name'
                        }
                        headers = {
                          'Authorization': 'Bearer {token}',
                          'Accept': 'application/json',
                          'X-Requested-With': 'XMLHttpRequest'
                        }
                        response = requests.request('GET', url, headers=headers, params=params)
                        response.json()
                summary: Python
              CSharp:
                description: |
                  -
                        using RestSharp;

                        var client = new RestClient("https://api.canoesoftware.com/");
                        var request = new RestRequest("v1/funds/1/documents", Method.Get);
                        request.AddParameter("Authorization", string.Format("Bearer {token}"), ParameterType.HttpHeader)
                        request.AddHeader("Accept", "application/json");
                        request.AddHeader("X-Requested-With", "XMLHttpRequest");
                        request.AddQueryParameter("start_time", "2019-03-30T04:00:00Z");
                        request.AddQueryParameter("page", "1");
                        request.AddQueryParameter("limit", "50");
                        request.AddQueryParameter("file_name_type", "original_file_name");
                        var response = client.Execute(request);
                        foreach (var h in response.ContentHeaders) {
                            if (h.Name=="Content-Disposition") {
                                var disposition = h.Value.ToString();
                                var filename = disposition.Substring(disposition.IndexOf("filename=") + "filename=".Length);
                                File.WriteAllBytes(filename, response.RawBytes);
                            }
                        }
                summary: CSharp
