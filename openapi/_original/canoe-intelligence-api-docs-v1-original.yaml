                summary: PHP
              Python:
                description: |
                  -
                        import requests
                        import json

                        url = 'https://api.canoesoftware.com/v1/documents/1'
                        headers = {
                          'Authorization': 'Bearer {token}',
                          'Accept': 'application/json',
                          'X-Requested-With': 'XMLHttpRequest'
                        }
                        response = requests.request('GET', url, headers=headers)
                        response.json()
                summary: Python
              CSharp:
                description: |
                  -
                        using RestSharp;

                        var client = new RestClient("https://api.canoesoftware.com/");
                        var request = new RestRequest("v1/documents/1", Method.Get);
                        request.AddParameter("Authorization", string.Format("Bearer {token}"), ParameterType.HttpHeader);
                        request.AddHeader("Accept", "application/json");
