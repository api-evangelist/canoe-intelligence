      type: object
      properties:
        id:
          type: string
          description: Unique ID of the document
          example: '16'
        client_document_id:
          type: string
          description: Custom ID of the client document
          example: custom_id_16
        name:
          type: string
          description: Name of the document
          example: "Sample Hedge Fund Deal 1 - Entity A - Account Statement - 07/31/19"
        document_status:
          type: string
          description: Status of the document (e.g., Complete)
          example: Complete
        category:
          type: string
          description: Category of the document (e.g., Capital Activity)
          example: Capital Activity
        document_type:
          type: string
          description: Type of the document (e.g., Account Statement)
          example: Account Statement
        source:
          type: string
          description: Source of the document (e.g., Upload Engine)
          example: Upload Engine
        file_type:
          type: string
          description: Type of the file (e.g., ".pdf")
          example: ".pdf"
        original_file_type:
          type: string
          description: Original type of the file before any conversion (e.g., ".docx")
          example: ".docx"
        original_file_name:
          type: string
          description: Original file name of the document
          example: "Entity One - Sample HF Deal.pdf"
        document_tags:
          type: array
          description: Tags associated with the document
          items:
            type: object
            properties:
              id:
                type: integer
                description: Tag ID
                example: 1
              name:
                type: string
                description: Tag name
                example: tag_1
        reporting_frequency:
          type: string
          description: Reporting frequency of the document (e.g., Monthly)
          example: Monthly
        uploaded:
          type: string
          format: date-time
          description: The datetime when the document was uploaded.
          example: '2019-04-30T20:51:38Z'
        last_modified:
          type: string
          format: date-time
          description: The datetime when the document was last modified.
          example: '2019-09-16T11:38:47Z'
        last_modified_by:
          type: object
          description: Information about the user who last modified the document
          properties:
            user_id:
              type: string
              description: User ID of the modifier
              example: user_canoe
            name:
              type: string
              description: Name of the user who modified the document
              example: canoe software
            email:
              type: string
              description: Email address of the user who modified the document
              example: info@canoesoftware.com
        document_approval:
          description: Approval status of the document. Can be a string 'Pending' when no approval exists, or an object with approval details when approved.
          oneOf:
            - type: string
              enum: [Pending]
              description: When no approval exists
            - type: object
              description: When document is approved
              properties:
                approval_status:
                  type: string
                  description: Approval status of the document
                  example: Approved
                approved_by:
                  type: object
                  description: Information about the user who approved the document
                  properties:
                    user_id:
                      type: string
                      description: User ID of the approver
                      example: user_1
                    first_name:
                      type: string
                      description: First name of the user who approved the document
                      example: Allison
                    last_name:
                      type: string
                      description: Last name of the user who approved the document
                      example: Smith
                    email:
                      type: string
                      description: Email address of the user who approved the document
                      example: allison@example.com
                approval_date:
                  type: string
                  format: date-time
                  description: The datetime when the document was approved.
                  example: '2019-09-16T11:38:47Z'
        is_locked:
          type: boolean
          description: Indicates whether the document is locked or not
          example: false
        ready_for_extract:
          type: boolean
          description: Extraction readiness status of the document
          example: true
        number_of_pages:
          type: string
          description: Number of pages in the document
          example: '1'
        file_size:
          type: integer
          description: Size of the file in bytes
          example: 2000
        comment:
          type: string
          description: Current comment associated with the document
          example: current comment
        comment_history:
          type: array
          description: History of comments for the document
          items:
            type: object
            properties:
              document_id:
                type: string
                description: ID of the commented document
                example: '1'
              comment:
                type: string
                description: Comment text
                example: comment
              user_id:
                type: string
                description: User ID of the commenter
                example: user_1
              created_at:
                type: string
                description: Comment creation date in format 'YYYY-MM-DD HH:MM:SS'
                example: '2019-09-16 11:38:47.000000'
        assignee:
          type: string
          description: User ID of the assignee
          example: user_1
        uploaded_by:
          type: string
          nullable: true
          description: Full name of the user who uploaded the document, or 'Canoe Connect System User' for documents uploaded via Canoe Connect
          example: John Smith
        allocations:
          type: array
          description: List of allocations related to the document
          items:
            type: object
            properties:
              allocation_id:
                type: string
                description: The ID of the allocation record
                example: 'allocation_1'
              data_date:
                type: string
                description: Date of the data in format 'YYYY-MM-DD'
                example: '2019-07-31'
              dataset_type:
                type: string
                description: Type of the dataset (e.g., Account Statement)
                example: Account Statement
              investment:
                type: string
                description: Name of the investment
                example: Sample Hedge Fund Deal 1
              fund_sponsor:
                type: string
                description: Name of the fund sponsor
                example: Sample Sponsor 1
              custom_allocation_id:
                type: string
                description: Custom ID of the allocation
                example: '123'
              investment_id:
                type: string
                description: ID of the investment
                example: '1'
              investment_legal_name:
                type: string
                description: Legal name of the investment
                example: Sample Hedge Fund Deal One
              investment_extraction_aliases:
                type: array
                nullable: true
                description: Aliases related to the investment extraction
                items:
                  type: string
                  example:
                    - Sample Hedge Fund Deal 1 alias 1
                    - Sample Hedge Fund Deal 1 alias 2
              investment_structure:
                type: string
                description: Type of the investment structure (e.g., hedge_fund)
                example: hedge_fund
              entity:
                type: string
                description: Name of the entity
                example: Entity One
              entity_id:
                type: string
                description: ID of the entity
                example: '4'
              entity_extraction_aliases:
                type: array
                nullable: true
                description: Aliases related to the entity extraction
                items:
                  type: string
                  example:
                    - Entity One alias 1
                    - Entity One alias 2
              account:
                type: string
                description: Name of the account
                example: Account One
              account_id:
                type: string
                description: ID of the account
                example: '1'
              extracted_data:
                type: object
                description: Extracted data related to the allocation
                properties:
                  entity:
                    type: string
                    description: Name of the entity
                    example: Entity One
                  fundName:
                    type: string
                    description: Name of the fund
                    example: Sample Hedge Fund Deal 1
                  endingDate:
                    type: string
                    description: Ending date in format 'MM/DD/YYYY'
                    example: '07/31/2019'
                  beginningDate:
                    type: string
                    description: Beginning date in format 'MM/DD/YYYY'
                    example: '07/01/2019'
                  endingBalance:
                    type: string
                    description: Ending balance as a string
                    example: '4,111,305'
                  beginningBalance:
                    type: string
                    description: Beginning balance as a string
                    example: '4,036,960'
                  otherFeesMTD:
                    type: string
                    description: Other fees for the month as a string
                    example: '508'
              validated_data:
                type: object
                description: Validated data related to the allocation
                properties:
                  entity:
                    type: string
                    description: Name of the entity
                    example: Entity One
                  fundName:
                    type: string
                    description: Name of the fund
                    example: Sample Hedge Fund Deal 1
                  endingDate:
                    type: string
                    description: Ending date in format 'YYYY-MM-DD'
                    example: '2019-07-31'
                  beginningDate:
                    type: string
                    description: Beginning date in format 'YYYY-MM-DD'
                    example: '2019-07-01'
                  endingBalance:
                    type: integer
                    description: Ending balance as an integer
                    example: 4111305
                  beginningBalance:
                    type: integer
                    description: Beginning balance as an integer
                    example: 4036960
                  otherFeesMTD:
                    type: integer
                    description: Other fees for the month as an integer
                    example: 508
              validation_errors:
                type: array
                description: Validation errors related to the allocation
                items:
                  type: string
                example: [ ]
              analyst:
                type: string
                description: Name of the analyst
                example: Allison
              frequency:
                type: string
                description: Frequency of the allocation (e.g., monthly)
                example: monthly
              custom_fields:
                type: array
                description: Custom fields associated with the allocation
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the custom field
                      example: CLIENT_ID
                    value:
                      type: string
                      description: Value of the custom field
                      example: BOX1
                    custom_field_id:
                      type: string
                      description: ID of the custom field
                      example: '1'
              document_groups:
                type: object
                description: Document groups associated with the allocation
                properties:
                  transaction:
                    type: object
                    properties:
                      group_id:
                        type: string
                        description: ID of the transaction group
                        example: transaction_group_id
                      member_document_ids:
                        type: array
                        description: IDs of the member documents in the group
                        items:
                          type: string
                          example:
                            - '16'
                            - '22'
                            - '35'
              addepar_owned_id:
                type: string
                description: Addepar owned ID
                example: AddeparOwned1
              addepar_owner_id:
                type: string
                description: Addepar owner ID
                example: AddeparOwner1
              black_diamond_symbol:
                type: string
                description: Black Diamond symbol
                example: BlackDiamondSymbol1
              black_diamond_account:
                type: string
                description: Black Diamond account
                example: BlackDiaAcc
              fund_name:
                type: string
                description: The fund associated with the allocation.
                example: Sample Hedge Fund Deal 1
              term_id:
                type: string
                description: The term id with the allocation.
                example: term_1
              term_name:
                type: string
                description: The term associated with the allocation.
                example: Sample Term 1
              allocation_status:
                type: string
                description: The current status of the allocation. It can be either active, inactive or retired.
                example: "active"
              retired_date:
                type: string
                description: The date of when the allocation retires.
                example: "2017-12-31"
    DocumentMetaData:
      type: object
      properties:
        id:
          type: string
          description: The id of the document that was updated.
          example: '3'
        document_status:
          type: string
          description: The updated document status.
          example: Complete
        approval_status:
          type: string
          description: The updated approval status of the document.
          example: Approved
        comment:
          type: string
          description: The updated comment on the document.
          example: Sample Comment.
        tags:
          type: array
          description: The array of tags associated with the document.
          items:
            type: object
            properties:
              id:
                type: string
                description: The id of the tag.
                example: '1'
              name:
                type: string
                description: The name of the tag.
                example: tag_1
        client_document_id:
          type: string
          description: The client document id.
          example: custom_document_id.
    UploadSingleDocument:
      type: object
      properties:
        id:
          type: string
          description: The document's ID at Canoe.
          example: canoe_document_id
        name:
          type: string
          description: The name of the uploaded document.
          example: uploaded_document_name
        client_document_id:
          type: string
          description: The custom document ID user specified for the uploaded document.
          example: '123'
    Allocations:
      type: object
      properties:
        id:
          type: string
          description: The ID of the allocation.
          example: '2'
        entity:
          type: string
          description: The name of the entity associated with the allocation.
          example: test_entity_1
        entity_id:
          type: string
          description: The ID of the entity associated with the allocation.
          example: '10'
        investment:
          type: string
          description: The name of the investment associated with the allocation.
          example: Fund One - Class A
        investment_id:
          type: string
          description: The ID of the investment associated with the allocation.
          example: '11'
        account:
          type: string
          description: The name of the account associated with the allocation.
          example: Account One
        account_id:
          type: string
          description: The ID of the account associated with the allocation.
          example: '12'
        initial_date:
          type: string
          format: date
          nullable: true
          description: The date when the allocation first becomes active.
          example: '2020-01-01'
        initial_amount:
          type: string
          description: The commitment amount of the allocation.
          example: '500000'
        status:
          type: string
          description: The current status of the allocation. It can be either active, pending, retired, or transitional.
          example: active
        custom_allocation_id:
          type: string
          description: The custom ID of the allocation.
          example: '13'
        created_at:
          type: string
          format: date-time
          description: The datetime of when the allocation was created.
          example: '2020-12-01T00:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: The datetime of when the allocation was last updated.
          example: '2020-12-02T00:00:00Z'
        retired_at:
          type: string
          format: date
          nullable: true
          description: The date when the allocation retires.
          example: null
        downstream_ids:
          type: array
          description: The allocation's downstream information.
          items:
            type: object
            properties:
              id:
                type: string
                description: The ID of the downstream system.
                example: 'investment_metrics_account_short_name'
              name:
                type: string
                description: The name of the downstream system.
                example: Account Short Name
              type:
                type: string
                description: The type of ID associated with the downstream system.
                example: Investment Metrics
              value:
                type: string
                description: The value of the downstream ID.
                example: '101112'
        custom_fields:
          type: array
          description: The list of custom fields associated with the allocation.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the custom field.
                example: CLIENT_ID
              value:
                type: string
                description: The value of the custom field.
                example: null
              custom_field_id:
                type: string
                description: The ID of the custom field.
                example: '2'
        allocation_entity_aliases:
          type: array
          description: The allocation entity aliases.
          items:
            type: string
            example: entity_alias_1
        allocation_fund_aliases:
          type: array
          description: The allocation fund aliases.
          items:
            type: string
            example: fund_alias_1
        fund_name:
          type: string
          description: The fund associated with the allocation.
          example: 'Fund One'
        term_id:
          type: string
          description: The term id with the allocation.
          example: term_1
        term_name:
          type: string
          description: The term associated with the allocation.
          example: 'Class A'
        extraction_status:
          type: string
          description: The extraction status of the allocation.
          example: Ready For Extract
    SingleAllocation:
      type: object
      properties:
        id:
          type: string
          description: The ID of the allocation.
          example: '1'
        entity:
          type: string
          description: The name of the entity associated with the allocation.
          example: Sample Entity
        entity_id:
          type: string
          description: The ID of the entity associated with the allocation.
          example: entity_1
        investment:
          type: string
          description: The name of the investment associated with the allocation.
          example: Sample Investment
        investment_id:
          type: string
          description: The ID of the investment associated with the allocation.
          example: investment_1
        account:
          type: string
          description: The name of the account associated with the allocation.
          example: Sample Account One
        account_id:
          type: string
          description: The ID of the account associated with the allocation.
          example: account_1
        initial_date:
          type: string
          format: date
          nullable: true
          description: The date when the allocation first becomes active.
          example: '2021-01-01'
        initial_amount:
          type: string
          description: The commitment amount of the allocation.
          example: '10000'
        status:
          type: string
          description: The current status of the allocation. It can be either active, pending, retired, or transitional.
          example: active
        custom_allocation_id:
          type: string
          description: The custom ID of the allocation.
          example: '700'
        created_at:
          type: string
          format: date-time
          description: The datetime of when the allocation was created.
          example: '2021-01-01T12:00:15Z'
        updated_at:
          type: string
          format: date-time
          description: The datetime of when the allocation was last updated.
          example: '2021-01-01T12:00:15Z'
        retired_at:
          type: string
          format: date
          nullable: true
          description: The date when the allocation retires.
          example: null
        downstream_ids:
          type: array
          description: The allocation's downstream information.
          items:
            type: object
            properties:
              id:
                type: string
                description: The ID of the downstream system.
              name:
                type: string
                description: The name of the downstream system.
              type:
                type: string
                description: The type of ID associated with the downstream system.
              value:
                type: string
                description: The value of the downstream ID.
          example:
            - id: black_diamond_account_name
              name: Black Diamond
              type: Account Name
              value: sample_name
        custom_fields:
          type: array
          description: The list of custom fields associated with the allocation.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the custom field.
              value:
                type: string
                description: The value of the custom field.
              custom_field_id:
                type: string
                description: The ID of the custom field.
          example:
            - name: Sample Allocation Custom Field
              value: '1000'
              custom_field_id: '1'
        allocation_entity_aliases:
          type: array
          description: The allocation entity aliases.
          items:
            type: string
          example:
            - entity_alias_1
            - entity_alias_2
        allocation_fund_aliases:
          type: array
          description: The allocation fund aliases.
          items:
            type: string
          example:
            - fund_alias_1
            - fund_alias_2
        fund_name:
          type: string
          description: The fund associated with the allocation.
          example: Sample Investment
        term_id:
          type: string
          description: The term id with the allocation.
          example: term_1
        term_name:
          type: string
          description: The term associated with the allocation.
          example: Sample Term
        extraction_status:
          type: string
          description: the extraction status on the allocation
          example: Ready For Extract
    GetFunds:
      type: object
      properties:
        id:
          type: string
          description: The fund's ID.
          example: '1'
        organization_id:
          type: string
          description: The ID of the organization that the fund is associated with.
          example: '12'
        type:
          type: string
          description: The fund's investment type.
          example: direct_investment
        status:
          type: string
          description: Indicates whether or not a fund is active. The status can be active, retired, or transitional.
          example: active
        name:
          type: string
          description: The name of the investment (fund + term).
          example: Sample Direct Deal 1
        sponsor:
          type: string
          description: The sponsor of the fund.
          example: Sample Sponsor 1
        start_date:
          type: string
          description: Fund Inception Date. The date on which the fund began its operations.
          example: '2015-11-10'
        aliases:
          type: array
          description: Aliases of the investment name. These are user-created.
          items:
            type: string
          example:
            - Sample Direct 1
            - SDD1
        legal_name:
          type: string
          description: The legal name of the fund.
          example: Sample Direct Deal 1 LP
        updated_at:
          type: string
          description: A timestamp of when the fund was updated.
          example: '2018-04-30 20:40:19'
        created_at:
          type: string
          description: A timestamp of when the fund was created.
          example: '2018-04-30 20:40:19'
        custom_fields:
          type: array
          description: The list of custom fields associated with the fund.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the custom field.
              value:
                type: string
                description: The value of the custom field.
              custom_field_id:
                type: string
                description: The ID of the custom field.
          example:
            - name: CLIENT_ID
              value: BOX1
              custom_field_id: '1'
        requirements_preference:
          type: object
          description: The requirements preference of the fund.
          properties:
            account_statements:
              type: object
              properties:
                balance:
                  type: string
                  description: Either ending_balance or price_units.
          example:
            - account_statements:
                balance: price_units
        term_id:
          type: string
          description: The ID of the term that is associated with the fund.
          example: '1'
        fund_name:
          type: string
          description: The name of the fund.
          example: Sample Direct
    SingleFund:
      type: object
      properties:
        id:
          type: string
          description: The fund's ID.
          example: '1'
        organization_id:
          type: string
          description: The ID of the organization that the fund is associated with.
          example: '12'
        type:
          type: string
          description: The fund's investment type.
          example: direct_investment
        status:
          type: string
          description: Indicates whether or not a fund is active. The status can be active, retired, or transitional.
          example: active
        name:
          type: string
          description: The name of the fund.
          example: Sample Direct Deal 1
        sponsor:
          type: string
          description: The sponsor of the fund.
          example: Sample Sponsor 1
        start_date:
          type: string
          description: Fund Inception Date. The date on which the fund began its operations.
          example: '2015-11-10'
        aliases:
          type: array
          description: Aliases of the investment name. These are user-created.
          items:
            type: string
          example:
            - Sample Direct 1
            - SDD1
        legal_name:
          type: string
          description: The legal name of the fund.
          example: Sample Direct Deal 1 LP
        updated_at:
          type: string
          description: A timestamp of when the fund was updated.
          example: '2018-04-30 20:40:19'
        created_at:
          type: string
          description: A timestamp of when the fund was created.
          example: '2018-04-30 20:40:19'
        custom_fields:
          type: array
          description: The list of custom fields associated with the fund.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the custom field.
              value:
                type: string
                description: The value of the custom field.
              custom_field_id:
                type: string
                description: The ID of the custom field.
          example:
            - name: CLIENT_ID
              value: BOX1
              custom_field_id: '1'
        fund_name:
          type: string
          description: The name of the fund.
          example: 'Sample Direct Deal 1'
        requirements_preference:
          type: object
          description: The requirements preference of the fund.
          properties:
            account_statements:
              type: object
              properties:
                balance:
                  type: string
                  description: Either ending_balance or price_units.
          example:
            - account_statements:
                balance: price_units
        term_id:
          type: string
          description: The ID of the term that is associated with the fund.
          example: '123'
        term_name:
          type: string
          description: The name of the term
          example: Deal 1
    FundDocumentData:
      type: object
      properties:
        id:
          type: string
          description: The ID of the document in Canoe.
          example: '1'
        client_document_id:
          type: string
          description: The custom document ID.
          example: 'custom_id_1'
        name:
          type: string
          description: The name of the document. This contains the Investment Name (and its corresponding Entity Name), the Document Type, as well as the Data Date.
          example: "Sample Hedge Fund Deal 1 - Entity A - Account Statement - 12/31/16"
        document_status:
          type: string
          description: This is the validation status determined by Canoe.
          example: 'Complete'
        category:
          type: string
          description: The category of the document.
          example: 'Capital Activity'
        document_type:
          type: string
          description: The document type. For example, Capital Call Notice and Account Statement are examples of two document types.
          example: 'Account Statement'
        source:
          type: string
          description: How the document entered Canoe.
          example: 'Upload Engine'
        file_type:
          type: string
          description: A document's file type, such as .PDF or .DOC. Canoe only supports extraction and validation of PDFs.
          example: '.pdf'
        original_file_type:
          type: string
          description: Original type of the file before any conversion (e.g., ".docx")
          example: ".docx"
        original_file_name:
          type: string
          description: The document's original file name including the file type extension.
          example: 'Entity A - Sample HF Deal.pdf'
        document_tags:
          type: array
          description: The list of tag objects (name, ID) assigned to the document.
          items:
