  Bulk Set Document Metadata:
    post:
      tags:
        - Documents
      summary:
      description: |
        /v1/documents/metadata

        Update metadata fields for up to 100 documents in a single request.
        Processing continues even if individual documents fail. Returns a summary
        of successful and failed updates.
      operationId: BulkSetDocumentMetadata
      parameters:
        - name: document_ids
          in: body
          description: Array of document IDs to update. Maximum 100 per request.
          required: true
          schema:
            type: array
            example:
              document_ids:
                - document_1
                - document_2
        - name: approval_status
          in: body
          description: Set the approval status for all specified documents.
            Valid values are Approved, Flagged, Ignored, Pending.
          required: false
          schema:
            type: string
            example:
              approval_status: Approved
        - name: comment
          in: body
          description: Set the internal comment for all specified documents.
          required: false
          schema:
            type: string
            example:
              comment: Reviewed and approved.
        - name: tags
          in: body
          description: Set or append document tags. Provide names array and optional
            overwrite flag. If overwrite is true, existing tags are replaced.
          required: false
          schema:
            type: object
            example:
              tags:
                names:
                  - TagA
                  - TagB
                overwrite: true
        - name: client_document_id
          in: body
          description: Set the client document ID for all specified documents.
          required: false
          schema:
            type: string
            example:
              client_document_id: CLIENT-REF-001
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: |
                  -
