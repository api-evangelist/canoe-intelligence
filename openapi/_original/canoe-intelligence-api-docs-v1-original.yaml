  Upload A Single Document:
    post:
      tags:
        - Documents
      summary:
      description: |
        /v1/documents

        Upload a Single Document
      operationId: UploadDocuments
      parameters:
        - name: file
          in: body
          description: The file you would like to upload to Canoe. This supports only
            one file per request. If you send multiple files through a single request,
            only first file will be taken. If you are including a non-PDF document,
            please make sure your tenant is enabled for these extensions before attempting
            upload.
          required: true
          schema:
            type: file
            example:
              file: ab
        - name: storage_only
          in: body
          description: Whether you want the uploaded file to be extracted. If it's set
            to true, it will not be extracted nor validated by Canoe. The default value
            for this is false.
          required: false
          schema:
            type: boolean
            example:
              storage_only: true
        - name: term_id
          in: body
          description: The term's ID you would like to associate the document with.
            This is <strong>required</strong> if storage_only is set to true. To retrieve
            term IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
            example:
              term_id: term_1
        - name: organization_id
          in: body
          description: This is the entity or account ID you would like to associate
            the document with. It's <strong>required</strong> if storage_only is set
            to true and the document type you specified is one of the client document
            types. It's not required if storage_only is set to true and the document
            type you specified is one of the general document types. To retrieve these,
            use the <code>v1/organizations</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
            example:
              organization_id: document_1,document_2
        - name: document_type_id
          in: body
          description: The document type you would like to associate the document with.
            It's <strong>required</strong> if storage_only is set to true. To retrieve
            these IDs, use the <code>v1/documents/types</code> <a href="#operations-Documents-GetDocumentsType"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
            example:
              document_type_id: document_1,document_2
        - name: client_document_id
          in: body
          description: The custom document ID you'd like to associate the document with. This must be a unique ID within your account; multiple documents cannot share the same ID.
          required: false
          schema:
            type: string
            example:
              document_type_id: 123,124
        - name: allocation_id
          in: body
          description: The ID of an existing investment (allocation) in Canoe to pre-seed categorization attributes. When provided, the document will be automatically associated with the investment's fund, entity, and term. This allows categorization to be seeded at upload time without a separate API call. To retrieve investment IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
            example:
              allocation_id: allocation_1
        - name: data_date
          in: body
          description: The data date to associate with the document, in <code>YYYY-MM-DD</code> format. Used to pre-seed the data date attribute during upload.
          required: false
          schema:
            type: string
            example:
              data_date: '2024-03-31'
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: |
                  -
                        curl -X POST \
                            "https://api.canoesoftware.com/v1/documents" \
                            -H "Authorization: Bearer {token}" \
                            -H "Accept: application/json" \
                            -H "X-Requested-With: XMLHttpRequest" \
                            -H "Content-Type: application/json" \
                            -d '{"file":"ab","storage_only":true,"term_id":"term_1","organization_id":"organization_1","document_type_id":"term_sheet_id","client_document_id":"123","allocation_id":"allocation_1","data_date":"2024-03-31"}'
                summary: Bash
