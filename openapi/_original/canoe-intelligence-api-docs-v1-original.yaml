    get:
      tags:
        - Organizations
      summary:
      description: |
        /v1/organizations/{id}/documents

        Download a specific Organization's documents in a ZIP file. Each fetch will download up to 100 documents. By default, this will fetch the first 100 documents in the Intelligent Document Center. A successful call to this endpoint will only contain the binary file and not the JSON data.
      operationId: DownloadOrganizationDocuments
      parameters:
        - name: id
          in: path
          description: The id of the organization.
          required: true
          schema:
            type: string
            example: 1
        - name: start_time
          in: query
          description: All documents downloaded will have an uploaded timestamp greater
            than or equal to the given start_time. Unless otherwise specified, the timestamp
            will be in EST (Eastern Standard Time). We suggest using the ISO 8601 format
            for the parameter. For example, '2019-09-18T00:00:00-07:00' represents the
            time in Pacific Daylight Time; this will be automatically converted to EST.
            In this case, the user will receive the documents uploaded on or after 2019-09-19
            at 03:00:00.
          required: false
          schema:
            type: string
          examples:
            start_time:
              value: '2019-03-30T04:00:00Z'
        - name: page
          in: query
          description: This page number corresponds with the pagination in Canoe's Intelligent
            Document Center. There are up to 100 documents on each page. For example,
            if you specify "2" you will see all of an Organization's documents on page
            2. By default, this is set to 1.
          required: false
          schema:
            type: string
          examples:
            page:
              value: '1'
        - name: limit
          in: query
          description: The number of documents for each download. The maximum number
            of documents as well as the default is 100.
          required: false
          schema:
            type: string
          examples:
            limit:
