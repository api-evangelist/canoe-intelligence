  Authentication Error Responses:
    get:
      tags:
        - Authentication
      summary:
      description: |
        <h3>Authentication Error Responses</h3>

        <p>When authentication fails, Canoe's API returns detailed error responses to help you diagnose and resolve issues. All authentication errors follow a consistent format with the following fields:</p>

        <table><thead>
            <tr>
                <th>Field</th>
                <th>Type</th>
                <th>Description</th>
            </tr>
            </thead><tbody>
            <tr>
                <td>error_code</td>
                <td>String</td>
                <td>A machine-readable error code that identifies the specific type of error (e.g., <code>INVALID_CREDENTIALS</code>, <code>MALFORMED_JWT</code>, <code>RATE_LIMIT_EXCEEDED</code>)</td>
            </tr>
            <tr>
                <td>error_description</td>
                <td>String</td>
                <td>A human-readable description of what went wrong</td>
            </tr>
            <tr>
                <td>hint</td>
                <td>String</td>
                <td>Actionable guidance on how to resolve the error</td>
            </tr>
            </tbody></table>

        <h4>Common Authentication Errors</h4>

        <p><strong>Invalid Credentials (400)</strong></p>
        <pre><code>{
            "error_code": "INVALID_CREDENTIALS",
            "error_description": "The user credentials were incorrect",
            "hint": "Please verify your client_id and client_secret are correct"
        }</code></pre>

        <p><strong>Malformed JWT Token (401)</strong></p>
        <pre><code>{
            "error_code": "MALFORMED_JWT",
            "error_description": "Token structure is invalid",
            "hint": "JWT tokens must have format: header.payload.signature"
        }</code></pre>

        <p><strong>Rate Limit Exceeded (429)</strong></p>
        <pre><code>{
            "error_code": "RATE_LIMIT_EXCEEDED",
            "error_description": "Too many failed authentication attempts",
            "retry_after": 60,
            "hint": "Please check your credentials and wait 60 seconds before trying again"
        }</code></pre>

        <aside class="warning">
            <strong>Rate Limiting:</strong> To protect against brute-force attacks, Canoe implements rate limiting on authentication endpoints. If you receive a 429 error, wait for the time specified in the <code>retry_after</code> field before attempting to authenticate again.
        </aside>

        <aside class="notice">
            <strong>Best Practices:</strong>
            <ul>
                <li>Store your client credentials securely and never commit them to version control</li>
                <li>Implement exponential backoff when retrying failed authentication requests</li>
                <li>Monitor the <code>error_code</code> field in your error handling to respond appropriately to different error types</li>
            </ul>
        </aside>
      operationId: AuthenticationErrorResponses
  Managing OAuth Clients:
    get:
      tags:
        - Authentication
      summary:
      description: |
        <p>To verify incoming API requests, Canoe's APIs use access tokens.</p>
        <p>Canoe API users may <a href="#managing-oauth-clients">create and manage their OAuth Client</a>, and use the <code>Client ID</code> and <code>Client Secret</code> to request an authorization code and access token.</p>
        <p>Canoe API users can also use the <code class="prettyprint">/v1/tokens</code> <a href="#password-grant-tokens">endpoint</a> to manage the access tokens. To authenticate to the <code class="prettyprint">/v1/tokens</code> endpoint, you will need API user credentials. This is one of the few API endpoints where you will need to use your user credentials; most other endpoints are authenticated through access tokens.</p>
        <aside class="notice">
            Note: An access token issued from Canoe will expire in 24 hours.
        </aside>
        <p>Once you have an access token, you can authenticate to Canoe's API endpoints. Pass the access token in the request header in the format <code class="prettyprint">Authorization: Bearer {token}</code>, where <code class="prettyprint">{token}</code> is your newly created personal access token.</p>
        <p>For example, if your newly created access token is "eyJ0eXAiOiJKV1QiLCJhbG", your header should look like "Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbG"</p>
        <p>If you are using Postman Collection for testing purpose, you could follow the steps here: <a href="https://learning.getpostman.com/docs/postman/sending_api_requests/authorization/#bearer-token" target="_blank"><u>Authorization - Bearer Token</u></a></p>
        <aside class="notice">
            Note: Sometimes, you want to give API access only to some specific IP addresses. Please contact us to enable that.
        </aside>

        <p>Developers building applications that need to interact with Canoe's API need to first register their application by creating a Client account. Typically, this consists of providing the name of their application and a URL that your application can redirect to after users approve their request for authorization. When a Client is created, it will be issued a <code>Client ID</code> and <code>Client Secret</code>. These values will be used when requesting access tokens from your application. </p>

        <p>Canoe API users can create and manage their OAuth Clients through the <a href=https://client.canoesoftware.com/api_configuration target="_blank"><u>API Configuration Dashboard</u></a>.</p>
      operationId: ManageAuthClient
  Requesting Tokens - Authorization Code:
    post:
      tags:
        - Authentication
      summary:
      description: |
        /oauth/token

        <p>Once a client has been created, you may use the <code>Client ID</code> and <code>Client Secret</code> to request an
        authorization code and access token from your application. First, your application should make a redirect request to
        Canoe's <code>oauth/authorize</code> route (see examples on the right panel)</p>

        <p>When receiving authorization requests, Canoe will ask users to approve or deny the authorization request. If users approve the request, they will be redirected back to the <code>redirect_uri</code> that was specified by the application that requested access (your application). The <code>redirect_uri</code> must match the <code>redirect</code> URL that was specified when the client was created.</p>
        <p>If the user approves the authorization request, they will be redirected back to the consuming application with the authorization code. The consumer should then issue a <code>POST</code> request to Canoe to request an access token. The request should include the authorization code that was issued by Canoe when the user approved the authorization request. See examples on the right panel and the parameters for the <code>POST</code> request below.</p>
      operationId: RequestingTokensAuthCodes
      parameters:
        - name: grant_type
          in: body
          description: The grant_type parameter must be set to "authorization_code".
          required: true
          schema:
            type: string
            example:
              grant_type: authorization_code
        - name: client_id
          in: body
          description: Your Application's Client ID.
          required: true
          schema:
            type: string
            example:
              client_id: client-id
        - name: client_secret
          in: body
          description: Your Application's Client Secret.
          required: true
          schema:
            type: string
            example:
              client_secret: your_client_secret
        - name: redirect_uri
          in: body
          description: Your Application's redirect URL. <b>It must match the redirect
            URL that was specified when the client was created.</b>
          required: true
          schema:
            type: string
            example:
              redirect_uri: https://your-application.com/callback
        - name: code
          in: body
          description: The authorization code issued by Canoe when the user approved
            the authorization request.
          required: true
          schema:
            type: string
            example:
              code: code
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: |
                  -
                        #Please go to the link below to authorize access.
                        https://api.canoesoftware.com/oauth/authorize?client_id=YOUR_CLIENT_ID&redirect_uri=YOUR_REDIRECT_URI&response_type=code

                        #Please copy the 'YOUR_AUTHORIZATION_CODE' in the redirect url(YOUR_REDIRECT_URI?code=YOUR_AUTHORIZATION_CODE) after approving access
                        curl -X POST "https://api.canoesoftware.com/oauth/token" \
                            -H "Accept: application/json" \
                            -H "X-Requested-With: XMLHttpRequest" \
                            -H "Content-Type: application/x-www-form-urlencoded" \
                            -d "grant_type=authorization_code&code=YOUR_AUTHORIZATION_CODE&redirect_uri=YOUR_REDIRECT_URI&client_id=YOUR_CLIENT_ID&client_secret=YOUR_CLIENT_SECRET"
                summary: Bash
              Javascript:
                description: |
                  -
                        const readline = require('readline');
                        const rl = readline.createInterface({
                            input: process.stdin,
                            output: process.stdout
                        });
                        const client_id = 'client_id';
                        const client_secret = 'client_secret';
                        const redirect_uri = 'https://your-application.com/callback';
                        const url = new URL("https://api.canoesoftware.com/oauth/authorize");
                        let params = {
                            "client_id": client_id,
                            "client_secret": client_secret,
                            "redirect_uri": redirect_uri,
                            "response_type": 'code',
                        };
                        Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
                        console.log('Please go to %s and authorize access.', url)
                        rl.question('Enter the authorization code returned in the callback URL.', (answer) => {
                            let code = answer;
                            let headers = {
                                "Accept": "application/json",
                                "X-Requested-With": "XMLHttpRequest",
                                "Content-Type": "application/json",
                            }
                            let body = {
                                'grant_type': "authorization_code",
                                'client_id': client_id,
                                'client_secret': client_secret,
                                'redirect_uri': redirect_uri,
                                'code': code,
                            };
                            axios.request('https://api.canoesoftware.com/oauth/token', {
                                method: "POST",
                                headers: headers,
                                data: body
                            })
                                .then(response => {
                                    console.log(response.data)
                                })
                                .catch(error => {
                                    console.log(error);
                                })
                            rl.close();
                        });
                summary: JavaScript
              PHP:
                description: |
                  -
                        Route::get('/redirect', function () {
                            $query = http_build_query([
                            'client_id' => 'client-id',
                            'redirect_uri' => 'https://your-application.com/callback',
                            'response_type' => 'code',
                            'scope' => '',
                            ]);
                            return redirect('https://api.canoesoftware.com/oauth/authorize?'.$query);
                        });


                        Route::get('/callback', function (Request $request) {
                            $http = new GuzzleHttp\Client;
                            $response = $http->post('https://api.canoesoftware.com/oauth/token', [
                                'form_params' => [
                                    'grant_type' => 'authorization_code',
                                    'client_id' => 'client-id',
                                    'client_secret' => 'client-secret',
                                    'redirect_uri' => 'https://your-application.com/callback',
                                    'code' => $request->code,
                                ],
                            ]);
                            return json_decode((string) $response->getBody(), true);
                        });
                summary: PHP
              Python:
                description: |
                  -
                        #This sample requires python OAuth library requests_oauthlib

                        from requests_oauthlib import OAuth2Session
                        import json
                        client_id = "client_id"
                        client_secret = "client_secret"
                        redirect_uri = "https://your-application.com/callback"
                        oauth = OAuth2Session(client_id, redirect_uri=redirect_uri)
                        authorization_url, state = oauth.authorization_url('https://api.canoesoftware.com/oauth/authorize')
                        print('Please go to {} and authorize access.'.format(authorization_url))
                        authorization_response = input('Enter the full callback URL')
                        token = oauth.fetch_token(
                        'https://api.canoesoftware.com/oauth/token',
                        authorization_response=authorization_response,
                        client_id=client_id,
                        client_secret=client_secret)
                        print(token)
                summary: Python
              CSharp:
                description: |
                  -
                        using System;
                        using System.Threading;
                        using RestSharp;

                        var client_id = "your_client_id";
                        var client_secret = "your_client_secret";
                        var redirect_uri = "your_redirect_url";
                        var baseUrl = "https://api.canoesoftware.com";
                        var client = new RestClient(baseUrl);
                        var request = new RestRequest(string.Format("/oauth/authorize?response_type=code&client_id={0}&client_secret={1}&redirect_uri={2}",client_id, client_secret, System.Web.HttpUtility.UrlEncode(redirect_uri)), Method.Get);
                        var url = client.BuildUri(request).ToString();
                        //The below workflow assumes the user does not have control over the redirect_uri
                        //If the redirect_uri goes to your application, you can request a token by exchanging the authorization code directly
                        string auth_code = null;
                        var ps = new System.Diagnostics.ProcessStartInfo(url)
                        {
                            UseShellExecute = true,
                            Verb = "open"
                        };
                        //This will open your default browser
                        System.Diagnostics.Process.Start(ps);
                        //Please copy the 'THE_AUTHORIZATION_CODE' in the redirect url(YOUR_REDIRECT_URI?code=THE_AUTHORIZATION_CODE) after approving access 
                        Console.WriteLine("Enter the authorization code returned in the callback URL:");
                        string code = Console.ReadLine();
                        request = new RestRequest("/oauth/token", Method.Post);
                        request.AddHeader("Accept", "application/json");
                        request.AddHeader("X-Requested-With", "XMLHttpRequest");
                        request.AddParameter("grant_type", "authorization_code");
                        request.AddParameter("code", code);
                        request.AddParameter("client_id", client_id);
                        request.AddParameter("client_secret", client_secret);
                        request.AddParameter("redirect_uri", redirect_uri);
                        var response = client.Execute(request);
                        Console.WriteLine(response.Content);
                summary: CSharp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationCode'
