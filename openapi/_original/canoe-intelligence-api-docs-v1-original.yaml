paths:
  Request:
    get:
      tags:
        - Introduction
      summary:
      description: |
        Canoe's API provides methods for retrieving extracted data from documents and their metadata as well as data from downloaded PDFs. This documentation includes detailed explanations of API endpoints and examples. You may not have access to all of the listed endpoints depending on the services you've purchased from Canoe as well as your user permissions.
        <p>By using Canoe’s API Documentation, you agree to the most recent version of <a href="https://canoeintelligence.com/api-terms-of-use/" target="_blank"><u>Canoe’s Developer Portal Terms of Use.</u></a></p>
        <p>In addition to the <code class="prettyprint">curl</code>, <code class="prettyprint">javascript</code>, <code class="prettyprint">python</code>, <code class="prettyprint">php</code> and <code class="prettyprint">CSharp</code> examples next to each endpoint, we've also included a <a href="https://www.getpostman.com" target="_blank"><u>Postman</u></a> collection. The collection contains API calls for each available endpoint.  Postman is a tool that helps generate and test API calls by providing a clean interface to build and save HTTP requests, and to check and test API responses. </p>

        <p>
            Note: Download Postman from their official website. Find out more about how to import Postman collections <a href="https://learning.getpostman.com/docs/postman/collections/data_formats/#importing-postman-data" target="_blank"><u>here</u></a>.
        </p>
        <p>
            Your information security team may require whitelisting Canoe’s IP addresses before you can call the API.  Whitelist the IP addresses found in <a href="https://client.canoesoftware.com/knowledge-base#/api/canoe-api-overview" target="_blank"><u>this knowledge base page</u></a> to allow all API addresses of Canoe. <b>(Note: You must be logged into your Canoe account to access the knowledge base page)</b>
        </p>
        <p>
            Your information technology team may require you to open ports to call the API. The API uses port numbers 443 and 9443.
        </p>
        <p>
            Additionally, your information security team may request that Canoe limit the IP address(es) from which you can make API calls as an extra layer of data protection. If so, please reach out to our support team.
        </p>

        <br>
        <strong><u>Request:</u></strong>

        The base URL for all Canoe API requests is <code class="prettyprint">https://api.canoesoftware.com</code>

        The API is built on RESTful principles with resource-oriented URL endpoints. HTTP status codes are used to indicate any API errors and all responses are returned in JSON format. All requests must be made over an HTTPS connection to ensure a secure transmission of data. Following a RESTful structure, requests should hit API endpoints using the appropriate HTTP method, which will depend on the desired action:

        <table><thead>
            <tr>
                <th>Method</th>
                <th>Description</th>
            </tr>
            </thead><tbody>
            <tr>
                <td>GET</td>
                <td>Use the <strong>GET</strong> method to retrieve information about your users, their organizations, and available associated data. This will always be a read-only request, so queried objects will never be modified by a GET request. When using filter parameters that include special characters, you should always encode those values to fit URI specifications.</td>
            </tr>
            <tr>
                <td>POST</td>
                <td>Use a <strong>POST</strong> method to create a new object, such as a new user or organization. Request parameters should be given in JSON format. The response body will typically return the newly created resource.</td>
            </tr>
            <tr>
                <td>PUT</td>
                <td>Use a <strong>PUT</strong> method to update an object, such as updating user credentials. As with a POST request, parameters should be given in JSON format. If successful, the response body will typically return the modified object.</td>
            </tr>
            <tr>
                <td>DELETE</td>
                <td>Use a <strong>DELETE</strong> method to delete an object, such as deleting one of your funds. Successful DELETE requests will typically return an empty response body.</td>
            </tr>
            </tbody></table>
      operationId: IntroductionRequest
  Response:
    get:
      tags:
        - Introduction
      summary:
      description: |
        <strong><u>Response:</u></strong>

        <p>All non-empty response bodies, including errors, will be formatted as a JSON object. If you are fetching multiple entries, such as <code class="prettyprint">/v1/funds</code> example, the data will be returned as a list. If you are fetching a single entry, such as <code class="prettyprint">GET /v1/funds/1</code>, the data will be returned as a single object.</p>
        <p>Canoe's APIs use standard HTTP status codes to indicate the status of a request.</p>
        <p>Below is a brief overview of the most common status codes:</p>
        <table><thead>
            <tr>
                <th>Code</th>
                <th>Text</th>
                <th>Definition</th>
            </tr>
            </thead><tbody>
            <tr>
                <td>200</td>
                <td>OK</td>
                <td>Success!</td>
            </tr>
            <tr>
                <td>400</td>
                <td>Bad Request</td>
                <td>The request was invalid or cannot be otherwise served. This could be due to an invalid or malformed parameter, etc.</td>
            </tr>
            <tr>
                <td>401</td>
                <td>Unauthorized</td>
                <td>The API authentication credentials or access token are missing or incorrect.</td>
            </tr>
            <tr>
                <td>403</td>
                <td>Forbidden</td>
                <td>The credentials or access token are authenticated, but you do not have access to the requested resource.</td>
            </tr>
            <tr>
                <td>404</td>
                <td>Not Found</td>
                <td>The requested resource is invalid or the resource requested, such as a Fund, does not exist. The 404 status code might indicates that the REST API can't map the client's URI to a resource but may be available in the future.</td>
            </tr>
            <tr>
                <td>405</td>
                <td>Method Not Allowed</td>
                <td>The request tried to use an HTTP method that the resource does not allow. For instance, a read-only resource could support only GET, but not PUT or DELETE or POST.</td>
            </tr>
            <tr>
                <td>429</td>
                <td>Too Many Requests</td>
                <td>You have exceeded the rate limit for this endpoint. Wait for the time specified in the <code>retry_after</code> response header before retrying. See Authentication Error Responses section for more details.</td>
            </tr>
            <tr>
                <td>500</td>
                <td>Internal Server Error</td>
                <td>There are internal or API-related errors on Canoe's side. Additional requests will not resolve the issue.</td>
            </tr>
            <tr>
                <td>503</td>
                <td>Service Unavailable</td>
                <td>The Canoe servers are up, but overloaded with requests. Try again later.</td>
            </tr>
            </tbody></table>
      operationId: IntroductionResponse
  Get Allocations:
    get:
      tags:
        - Allocations
      summary:
      description: |
        /v1/allocations

        Fetch all allocations accessible by the current API user.
      operationId: GetAllocation
      parameters:
        - name: page
          in: query
          description: This page number. For example, if you specify "2" you will see
            all documents on page 2. By default, this is set to 1.
          required: false
          schema:
            type: integer
          examples:
            page 1:
              value: 1
            page 5:
              value: 5
        - name: perPage
          in: query
          description: The number of allocations displayed on each page. The maximum
            number of allocations as well as the default is 100.
          required: false
          schema:
            type: integer
          examples:
            perPage:
              value: 50
        - name: allocation_id
          in: query
          description: Returns exact allocation record for a specific id. Multiple ids
            are separated by a comma. Example:- allocation_id1, allocation_id2
          required: false
          schema:
            type: string
          examples:
            allocation_id single:
              value: allocation_id12
            allocation_id multiple:
              value: allocation_id1,allocation_id2
        - name: entity_id
          in: query
          description: Returns exact match on Entity ID that is directly associated
            to the allocation. Multiple ids are separated by a comma. Example:- entity_3
          required: false
          schema:
            type: string
          examples:
            entity_id single:
              value: entity_id1
            entity_id multiple:
              value: entity_id1,entity_id2
        - name: investment_id
          in: query
          description: Returns exact allocations related to a specific investment/term.
            Multiple ids are separated by a comma. Example:- investment_id1, investment_id2
          required: false
          schema:
            type: string
          examples:
            investment_id single:
              value: investment_id1
            investment_id multiple:
              value: investment_id1,investment_id2
        - name: custom_allocation_id
          in: query
          description: Returns exact allocations related to a specific tenant assigned
            investment id. Multiple ids are separated by a comma. Example:- customId1, customId2
          required: false
          schema:
            type: string
          examples:
            custom_allocation_id single:
              value: custom_allocation_id_1
            custom_allocation_id multiple:
              value: custom_allocation_id_1,custom_allocation_id_2
        - name: status
          in: query
          description: Returns allocations related to a specific status. Valid Status
            values are active, pending, retired, or transitional. Multiple ids are separated
            by a comma. Example:- active, pending
          required: false
          schema:
            type: string
          examples:
            status 1:
              value: active
            status 2:
              value: pending
            status multiple:
              value: active,pending
        - name: account_id
          in: query
          description: Returns allocations related to a specific account. Multiple ids
            are separated by a comma. Example:- account_1, account_2
          required: false
          schema:
            type: string
          examples:
            account_id single:
              value: account_1
            account_id multiple:
              value: account_1,account_2
        - name: custom_field
          in: query
          description: An indexed string of one or more custom field IDs, which relate to allocation specific custom fields, and one or more custom field values for each. Specify the custom field ID and then the custom field value(s). When filtering on multiple values, separate them by commas.  Filter on additional custom fields by separating with an ampersand. Example:- /v1/allocations?custom_field[bfa7ec21-9a73-4640-03b2-0e32aa1ae8a6]=value1,value2;custom_field[another-custom-field-id]=another-value1
          required: false
          schema:
            type: string
          examples:
            custom_field:
              value: custom_field[bfa7ec21-9a73-4640-03b2-0e32aa1ae8a6]=value1,value2
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: |
                  -
                        curl -X GET \
                        -G "https://api.canoesoftware.com/v1/allocations?page=1&perPage=50&allocation_id=investment_1&entity_id=entity_3" \
                        -H "Authorization: Bearer {token}" \
                        -H "Accept: application/json" \
                        -H "X-Requested-With: XMLHttpRequest"
                summary: Bash
              Javascript:
                description: |
                  -
                        const url = new URL(
                            "https://api.canoesoftware.com/v1/allocations"
                        );
                  
                        let params = {
                            "page": "1",
                            "perPage": "50",
                            "allocation_id":"investment_1",
                            "entity_id":"entity_3"
                        };
                  
                        let headers = {
                            "Authorization": "Bearer {token}",
                            "Accept": "application/json",
                            "X-Requested-With": "XMLHttpRequest",
                            "Content-Type": "application/json",
                        };
                  
                        fetch(url, {
                            method: "GET",
                            headers: headers,
                        })
                        .then(response => response.json())
                        .then(json => console.log(json));
                summary: JavaScript
              PHP:
                description: |
                  -
                        $client = new \GuzzleHttp\Client();
                        $response = $client->get(
                            'https://api.canoesoftware.com/v1/allocation',
                            [
                                'headers' => [
                                    'Authorization' => 'Bearer {token}',
                                    'Accept' => 'application/json',
                                    'X-Requested-With' => 'XMLHttpRequest',
                                ],
                            ]
                        );
                        $body = $response->getBody();
                        print_r(json_decode((string) $body));
                summary: PHP
              Python:
                description: |
                  -
                        import requests
                        import json
                  
                        url = 'https://api.canoesoftware.com/v1/allocations'
                        params = {
                          'page': '1',
                          'perPage': '50',
                          'allocation_id':'investment_1',
                          'entity_id':'entity_3'
                        }
                        headers = {
                          'Authorization': 'Bearer {token}',
                          'Accept': 'application/json',
                          'X-Requested-With': 'XMLHttpRequest'
                        }
                        response = requests.request('GET', url, headers=headers, params=params)
                        response.json()
                summary: Python
              CSharp:
                description: |
                  -
                        using RestSharp;

                        var client = new RestClient("https://api.canoesoftware.com/");
                        var request = new RestRequest("v1/allocations", Method.Get);
                        request.AddParameter("Authorization", string.Format("Bearer {token}"), ParameterType.HttpHeader);
                        request.AddHeader("Accept", "application/json");
                        request.AddHeader("X-Requested-With", "XMLHttpRequest");
                        request.AddQueryParameter("page", "1");
                        request.AddQueryParameter("perPage", "50");
                        request.AddQueryParameter("allocation_id", "investment_1");
                        request.AddQueryParameter("entity_id", "entity_3");
                        var response = client.Execute(request);
                        Console.WriteLine(response.Content);
                summary: CSharp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Allocations'
        '403':
          description: No access to the document.
  Create A Single Allocation:
    post:
      tags:
        - Allocations
      summary:
      description: |
        /v1/allocations

        Create a new allocation based on the input parameters.
      operationId: CreateSingleAllocation
      parameters:
        - name: entity_id
          in: body
          description: The ID of the Entity in Canoe.
          required: true
          schema:
            type: string
            example:
              entity 1: entity_1
        - name: fund_id
          in: body
          description: The ID of the Investment/Fund in Canoe.
          required: true
          schema:
            type: string
            example:
              fund_id: investment_1
        - name: term_id
          in: body
          description: The ID of the term at canoe. If not provided, the default term will be assigned.
          required: false
          schema:
            type: string
            example:
              term_id: term_1
        - name: initial_date
          in: body
          description: Allocation inception Date. Its format is yyyy-mm-dd.
          required: true
          schema:
            type: string
            example:
              initial_date: '2021-01-01'
        - name: initial_amount
          in: body
          description: The initial amount for the allocation. Value must be greater
            than 0.
          required: true
          schema:
            type: string
            example:
              initial_amount: 10000
        - name: status
          in: body
          description: Indicates whether an allocation is active. The status can be
            active, pending, retired, or transitional. If not provided, the default is active.
          required: false
          schema:
            type: string
            example:
              status: active
        - name: custom_allocation_id
          in: body
          description: The custom allocation ID you'd like to associate the allocation
            with.
          required: false
          schema:
            type: string
            example:
              custom_allocation_id: 700
        - name: downstream_ids
          in: body
          description:
          required: false
          schema:
            type: array
            example:
              downstream_ids:
                - id: black_diamond_account_name
                  value: sample_name
        - name: downstream_ids.*.id
          in: body
          description: ID of the allocation downstream system identifier. Possible options
            are black_diamond_account_name, black_diamond_account_number, archway_portfolio_id,
            investment_metrics_account_short_name.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - id: black_diamond_account_name
        - name: downstream_ids.*.value
          in: body
          description: The value for the specified downstream system identifier.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - value: sample_name
        - name: custom_fields
          in: body
          description:
          required: false
          schema:
            type: array
            example:
              custom_fields:
                - id: 1
                  value: 1000
        - name: custom_fields.*.id
          in: body
          description: ID of the allocation custom field. This can be retrieved by using
            the Get Allocations endpoint.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - id: 1
        - name: custom_fields.*.value
          in: body
          description: The value of the custom Field.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - value: 1000
        - name: allocation_entity_aliases
          in: body
          description: Aliases of the allocation entity name. These are user-created.
            If there are multiple aliases, they should be separated by commas.
          required: false
          schema:
            type: string
            example:
              allocation_entity_aliases: Sample allocation entity alias 1,Sample allocation
                entity alias 2
        - name: allocation_fund_aliases
          in: body
          description: Aliases of the allocation fund name. These are user-created.
            If there are multiple aliases, they should be separated by commas.
          required: false
          schema:
            type: string
            example:
              allocation_fund_aliases: Sample allocation fund alias 1,Sample allocation
                fund alias 2
        - name: retired_at
          in: body
          description: Allocation retire date. Retired date must be provided if the
            status is set to retired and should be at least one month after the initial
            investment date.
          required: false
          schema:
            type: string
            example:
              retired_at: '2022-01-01'
        - name: extraction_status
          in: body
          description: The status of the allocation extraction. The status can be Ready For Extract and
            Not Ready For Extract
          required: false
          schema:
            type: string
            example:
              extraction_status: 'Ready For Extract'
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: |
                  -
                        curl -X POST \
                            "https://api.canoesoftware.com/v1/allocations" \
                            -H "Authorization: Bearer {token}" \
                            -H "Accept: application/json" \
                            -H "X-Requested-With: XMLHttpRequest" \
                            -H "Content-Type: application/json" \
                            -d '{"entity_id":"entity_1","fund_id":"investment_1","initial_date":"2021-01-01","initial_amount":"10000","status":"active","custom_allocation_id":"700","downstream_ids":[{"id":"black_diamond_account_name","value":"sample_name"}],"custom_fields":[{"id":"1","value":"1000"}],"allocation_entity_aliases":"Sample allocation entity alias 1,Sample allocation entity alias 2","allocation_fund_aliases":"Sample allocation fund alias 1,Sample allocation fund alias 2"}'
                summary: Bash
              Javascript:
                description: |
                  -
                        const url = new URL(
                          "https://api.canoesoftware.com/v1/allocations"
                        );
                  
                        let headers = {
                          "Authorization": "Bearer {token}",
                          "Accept": "application/json",
                          "X-Requested-With": "XMLHttpRequest",
                          "Content-Type": "application/json",
                        };
                  
                        let body = {
                          "entity_id": "entity_1",
                          "fund_id": "investment_1",
                          "initial_date": "2021-01-01",
                          "initial_amount": "10000",
                          "status": "active",
                          "custom_allocation_id": "700",
                          "downstream_ids": [
                            {
                              "id": "black_diamond_account_name",
                              "value": "sample_name"
                            }
                          ],
                          "custom_fields": [
                            {
                              "id": "1",
                              "value": "1000"
                            }
                          ],
                          "allocation_entity_aliases": "Sample allocation entity alias 1,Sample allocation entity alias 2",
                          "allocation_fund_aliases": "Sample allocation fund alias 1,Sample allocation fund alias 2"
                        }
                        fetch(url, {
                          method: "POST",
                          headers: headers,
                          body: body
                        })
                        .then(response => response.json())
                        .then(json => console.log(json));
                summary: JavaScript
              PHP:
                description: |
                  -
                        $client = new \GuzzleHttp\Client();
                        $response = $client->post(
                          'https://api.canoesoftware.com/v1/allocations',
                          [
                            'headers' => [
                              'Authorization' => 'Bearer {token}',
                                      'Accept' => 'application/json',
                              'X-Requested-With' => 'XMLHttpRequest',
                              'Content-Type' => 'application/json',
                            ],
                            'json' => [
                              'entity_id' => 'entity_1',
                              'fund_id' => 'investment_1',
                              'initial_date' => '2021-01-01',
                              'initial_amount' => '10000',
                              'status' => 'active',
                              'custom_allocation_id' => '700',
                              'downstream_ids' => [
                                [
                                  'id' => 'black_diamond_account_name',
                                  'value' => 'sample_name',
                                ],
                              ],
                              'custom_fields' => [
                                [
                                  'id' => '1',
                                  'value' => '1000',
                                ],
                              ],
                              'allocation_entity_aliases' => 'Sample allocation entity alias 1,Sample allocation entity alias 2',
                              'allocation_fund_aliases' => 'Sample allocation fund alias 1,Sample allocation fund alias 2',
                            ],
                          ]
                        );
                        $body = $response->getBody();
                        print_r(json_decode((string) $body));
                summary: PHP
              Python:
                description: |
                  -
                        import requests
                        import json

                        url = 'https://api.canoesoftware.com/v1/allocations'
                        params = {
                          'page': '1',
                          'perPage': '50',
                          'allocation_id':'investment_1',
                          'entity_id':'entity_3'
                        }
                        headers = {
                          'Authorization': 'Bearer {token}',
                          'Accept': 'application/json',
                          'X-Requested-With': 'XMLHttpRequest'
                        }
                        response = requests.request('GET', url, headers=headers, params=params)
                        response.json()
                summary: Python
              CSharp:
                description: |
                  -
                        using RestSharp;
                  
                        var client = new RestClient("https://api.canoesoftware.com/");
                        var request = new RestRequest("v1/allocations", Method.Post);
                        request.AddParameter("Authorization", string.Format("Bearer {token}"), ParameterType.HttpHeader);
                        request.AddHeader("Accept", "application/json");
                        request.AddHeader("X-Requested-With", "XMLHttpRequest");
                        request.AddHeader("Content-Type", "application/json");
                        var body = new
                        {
                          entity_id = "entity_1",
                          fund_id = "investment_1",
                          initial_date = "2021-01-01",
                          initial_amount = "10000",
                          status = "active",
                          custom_allocation_id = 700,
                          downstream_ids = new[]
                          {
                            new { id = black_diamond_account_name, value = sample_name }
                          },
                          custom_fields = new[]
                          {
                            new { id = 1, value = 100 }
                          },
                          allocation_entity_aliases = "Sample allocation entity alias 1,Sample allocation entity alias 2",
                          allocation_fund_aliases = "Sample allocation fund alias 1,Sample allocation fund alias 2"
                        };
                        request.AddJsonBody(body);
                        var response = client.Execute(request);
                        Console.WriteLine(response.Content);
                summary: CSharp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SingleAllocation'
        '403':
          description: Failed to create the allocation.
        '422':
          description: The date entered should have the format yyyy-mm-dd.
  Update A Single Allocation:
    put:
      tags:
        - Allocations
      summary:
      description: |
        /v1/allocations/{id}

        Update an existing allocation based on the input parameters.
      operationId: UpdateSingleAllocation
      parameters:
        - name: id
          in: path
          description: The id of the allocation you want to edit.
          required: true
          schema:
            type: string
            example: 1
        - name: initial_date
          in: body
          description: Allocation inception Date. Its format is yyyy-mm-dd.
          required: false
          schema:
            type: string
            example:
              initial_date: 2021-01-01
        - name: initial_amount
          in: body
          description: The initial amount for the allocation. Value must be greater
            than 0.
          required: false
          schema:
            type: string
            example:
              initial_amount: 10000
        - name: status
          in: body
          description: Indicates whether an allocation is active. The status can be
            active, pending, retired, or transitional. If not provided, the default is active.
          required: false
          schema:
            type: string
            example:
              initial_amount: active
        - name: custom_allocation_id
          in: body
          description: The custom allocation ID you'd like to associate the allocation
            with.
          required: false
          schema:
            type: string
            example:
              custom_allocation_id: 123
        - name: downstream_ids
          in: body
          description:
          required: false
          schema:
            type: array
            example:
              downstream_ids:
                - id: black_diamond_account_name
                  value: sample_name
        - name: downstream_ids.*.id
          in: body
          description: ID of the allocation downstream system identifier. Possible options
            are black_diamond_account_name, black_diamond_account_number, archway_portfolio_id,
            investment_metrics_account_short_name.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - id: black_diamond_account_name
        - name: downstream_ids.*.value
          in: body
          description: The value for the specified downstream system identifier.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - value: sample_name
        - name: custom_fields
          in: body
          description:
          required: false
          schema:
            type: array
            example:
              custom_fields:
                - id: 1
                  value: 1000
        - name: custom_fields.*.id
          in: body
          description: ID of the allocation custom field. This can be retrieved by using
            the Get Allocations endpoint.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - id: 1
        - name: custom_fields.*.value
          in: body
          description: The value of the custom Field.
          required: true
          schema:
            type: string
            example:
              downstream_ids:
                - value: 1000
        - name: allocation_entity_aliases
          in: body
          description: Aliases of the allocation entity name. These are user-created.
            If there are multiple aliases, they should be separated by commas.
          required: false
          schema:
            type: string
            example:
              allocation_entity_aliases: Sample allocation entity alias 1,Sample allocation
                entity alias 2
        - name: allocation_fund_aliases
          in: body
          description: Aliases of the allocation fund name. These are user-created.
            If there are multiple aliases, they should be separated by commas.
          required: false
          schema:
            type: string
            example:
              allocation_fund_aliases: Sample allocation fund alias 1,Sample allocation
                fund alias 2
        - name: retired_at
          in: body
          description: Allocation retire date. Retired date must be provided if the
            status is set to retired and should be at least one month after the initial
            investment date.
          required: false
          schema:
            type: string
            example:
              retired_at: '2022-01-01'
        - name: extraction_status
          in: body
          description: The status of the allocation extraction. The status can be Ready For Extract and
            Not Ready For Extract
          required: false
          schema:
            type: string
            example:
              extraction_status: 'Ready For Extract'
