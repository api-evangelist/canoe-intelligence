                        fetch(url, {
                            method: "POST",
                            headers: headers,
                            body: body
                        })
                            .then(response => response.json())
                            .then(json => console.log(json));
                summary: JavaScript
              PHP:
                description: |
                  -
                        $client = new \GuzzleHttp\Client();
                        $response = $client->post(
                            'https://api.canoesoftware.com/v1/documents',
                            [
