  Edit Document Attributes:
    put:
      tags:
        - Documents
      summary:
      description: |
        /v1/documents/edit-attributes

        Update categorization attributes for up to 100 documents in a single request. At least one of the following fields must be provided: <code>allocation_id</code>, <code>entity_id</code>, <code>term_id</code>, <code>data_date</code>, or <code>document_type_id</code>.

        The allocation can be specified in two ways:
        <ul>
          <li>By <code>allocation_id</code> — directly identifies an existing investment. This derives the associated fund, entity, and term automatically.</li>
          <li>By <code>term_id</code> + <code>entity_id</code> — must correspond to an existing investment record.</li>
        </ul>
      operationId: EditDocumentAttributes
      parameters:
        - name: document_ids
          in: body
          description: An array of Canoe document IDs to update. At least 1 and at most 100 document IDs may be provided per request.
          required: true
          schema:
            type: array
            items:
              type: string
            example:
              document_ids:
                - document_1
                - document_2
        - name: allocation_id
          in: body
          description: The ID of an existing investment (allocation) in Canoe. When provided, the document will be associated with the investment's fund, entity, and term. Takes precedence over <code>term_id</code> + <code>entity_id</code> when both are supplied. To retrieve investment IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
            example:
              allocation_id: allocation_1
        - name: entity_id
          in: body
          description: The entity (investment entity) ID to associate the documents with. To retrieve these, use the <code>v1/organizations?type=entity</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>. If provided alongside <code>term_id</code> (without <code>allocation_id</code>), the combination must correspond to a valid investment.
          required: false
          schema:
            type: string
            example:
              entity_id: entity_1
        - name: term_id
          in: body
          description: The term ID to associate the documents with. To retrieve term IDs, use the <code>v1/funds</code> <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>. If provided alongside <code>entity_id</code> (without <code>allocation_id</code>), the combination must correspond to a valid investment.
          required: false
          schema:
            type: string
            example:
              term_id: term_1
        - name: data_date
          in: body
          description: The data date to set on the document allocations, in <code>YYYY-MM-DD</code> format.
          required: false
          schema:
            type: string
            example:
              data_date: '2024-03-31'
        - name: document_type_id
          in: body
          description: The document type ID to assign to the documents. To retrieve valid document type IDs, use the <code>v1/documents/types</code> <a href="#operations-Documents-GetDocumentsType"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
            example:
              document_type_id: term_sheet_id
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              bash:
                description: |
                  -
                        curl -X PUT \
                            "https://api.canoesoftware.com/v1/documents/edit-attributes" \
                            -H "Authorization: Bearer {token}" \
                            -H "Accept: application/json" \
                            -H "X-Requested-With: XMLHttpRequest" \
                            -H "Content-Type: application/json" \
                            -d '{"document_ids":["document_1","document_2"],"allocation_id":"allocation_1","data_date":"2024-03-31","document_type_id":"term_sheet_id"}'
