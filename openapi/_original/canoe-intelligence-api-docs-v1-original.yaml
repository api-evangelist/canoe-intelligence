                                    'document_type_id' => 'term_sheet_id',
                                    'client_document_id' => '123',
                                    'allocation_id' => 'allocation_1',
                                    'data_date' => '2024-03-31',
                                ],
                            ]
                        );
                        $body = $response->getBody();
                        print_r(json_decode((string) $body));
                summary: PHP
              Python:
                description: |
                  -
                        import requests
                        import json

                        url = 'https://api.canoesoftware.com/v1/documents'
                        payload = {
                            "file": "ab",
