  Download Documents:
    get:
      tags:
        - Documents
      summary:
      description: |
        /v1/documents

        Download documents in a ZIP file. Each fetch will download up to 100 documents. By default, this will fetch the first 100 documents in the Intelligent Document Center. A successful call to this endpoint will only contain the binary file and not the JSON data.

        To retrieve additional information, you can inspect the response header data. There, you can find the total number of documents filtered by current query parameters.
      operationId: DownloadDocuments
      parameters:
        - name: page
          in: query
          description: This page number. For example, if you specify "2" you will see
            all documents on page 2. By default, this is set to 1. Example:- 1
          required: false
          schema:
            type: integer
          examples:
            page 1:
              value: 1
            page 5:
              value: 5
        - name: limit
          in: query
          description: The number of documents for each page. The maximum number of
            documents limit is 100. Example:- 50
          required: false
          schema:
            type: integer
          examples:
            limit:
              value: 50
        - name: fields
          in: query
          description: The fields you need in the partial response. The value of the
            fields parameter MUST be a comma-separated (U+002C COMMA, ",") list that
            refers to the name(s) of the fields to be returned.
          required: false
          schema:
            type: string
          examples:
            fields:
              value: name,validated_data
        - name: document_id
          in: query
          description: The IDs of the documents in Canoe.
          required: false
          schema:
            type: string
          examples:
            document_id:
              value: document_1,document_2
        - name: client_document_id
          in: query
          description: The custom document IDs.
          required: false
          schema:
            type: string
          examples:
            client_document_id:
              value: client_document_id
        - name: fund_id
          in: query
          description: The IDs of funds in Canoe. To retrieve these, use the <code>v1/funds</code>
            <a href="#operations-Funds-GetFunds"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
          examples:
            fund_id:
              value: fund_1,fund_2
        - name: account_id
          in: query
          description: The IDs of accounts in Canoe. To retrieve these, use the <code>v1/organizations?type=account</code>
            <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
          examples:
            account_id:
              value: account_1,account_2
        - name: investment_entity_id
          in: query
          description: The IDs of investment entities in Canoe. To retrieve these, use
            the <code>v1/organizations?type=entity</code> <a href="#operations-Organizations-Organizations"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
          examples:
            investment_entity_id:
              value: entity_1,entity_2
        - name: document_type
          in: query
          description: The document types. To retrieve these, use the <code>v1/documents/types</code>
            <a href="#operations-Documents-GetDocumentsType"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
          examples:
            document_type:
              value: Account Statement,Capital Call Notice
        - name: fund_sponsor
          in: query
          description: The Fund Sponsors. The entered Fund Sponsors must be an exact
            match, although all query parameters are case-insensitive.
          required: false
          schema:
            type: string
          examples:
            fund_sponsor_multiple:
              value: fund_sponsor_1,fund_sponsor_2
            fund_sponsor_single:
              value: fund_sponsor_1
        - name: data_date_start
          in: query
          description: All documents returned will have data date <strong>greater than
            or equal to</strong> the given data_date_start. This will be in EST (Eastern
            Standard Time).
          required: false
          schema:
            type: string
          examples:
            data_date_start:
              value: '2019-03-30'
        - name: data_date_end
          in: query
          description: All documents returned will have data date <strong>less than
            or equal to</strong> the given data_date_end. This will be in EST (Eastern
            Standard Time).
          required: false
          schema:
            type: string
          examples:
            data_date_end:
              value: '2019-03-30'
        - name: document_status
          in: query
          description: This is the validation status determined by Canoe. For example,
            Complete means that Canoe has successfully categorized, recognized, extracted,
            and validated data from the document.<br><br>Our current statuses are:<br><br><li>Complete</li><br><li>Potential
            Discrepancy</li><br><li>Duplicate</li><br><li>Password Protected</li><br><li>Configuration
            Required</li><br><li>Unsupported Formats</li><br><li>Anomaly Detected</li><br><li>Awaiting
            Confirmation</li><br><li>Storage Only</li><br><br>A misspelled status will
            return an empty array.
          required: false
          schema:
            type: string
          examples:
            document_status:
              value: Complete,Storage Only
        - name: document_source
          in: query
          description: The method of document ingestion. These sources are:<br><br><li>Upload
            Engine</li><br><li>Email</li><br><li>Intralinks</li><br><li>API</li>
          required: false
          schema:
            type: string
          examples:
            document_source:
              value: Email,Upload Engine
        - name: skip_downloaded
          in: query
          description: Setting to true excludes documents from the response that have previously been downloaded through the API for the document allocations that match the call's other request parameters. The default value is false.
          required: false
          schema:
            type: string
          examples:
            skip_downloaded:
              value: false
        - name: document_tag_id
          in: query
          description: The IDs of tags in Canoe. To retrieve these, use the <code>v1/documents/tags</code>
            <a href="#get-document-tags"><u>endpoint</u></a>.
          required: false
          schema:
            type: string
          examples:
            document_tag_id:
              value: tag_1,tag_2
        - name: file_upload_time_start
          in: query
          description: All documents downloaded will have an uploaded timestamp <strong>greater
            than or equal to</strong> the given file_upload_time_start. Unless otherwise
            specified, the timestamp will be in EST (Eastern Standard Time). We suggest
            using the <a target="_blank" href="https://www.iso.org/iso-8601-date-and-time-format.html"><u>ISO
            8601 format</u></a> for the parameter. For example, '2019-09-18T00:00:00-07:00'
            represents the time in Pacific Daylight Time; this will be automatically
            converted to EST. In this case, the user will receive the documents uploaded
            on or after 2019-09-19 at 03:00:00.
          required: false
          schema:
            type: string
          examples:
            file_upload_time_start:
              value: '2019-03-30T04:00:00Z'
        - name: file_upload_time_end
          in: query
          description: All documents downloaded will have an uploaded timestamp <strong>less
