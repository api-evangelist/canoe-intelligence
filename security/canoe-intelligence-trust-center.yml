published_controls:
- Principle of least privilege with periodic access review
- Role-based permissions
- HTTPS-only platform access
- Multi-factor authentication enforced
- Password complexity enforcement
- API IP filtering
- Identity federation / SSO (SAML 2.0)
- User access groups
- 30-minute session timeout; session id not in the URL
- Encryption in transit (TLS 1.2+) and at rest (AES-256)
- Sensitive documents accessible only inside the application, never emailed
- Cloud infrastructure vulnerability scanning
- Network and web application penetration testing
- Cloud security configuration assessment
- Audit logging of all data access and extraction events
- Data residency controls; on-premise and private-cloud deployment options
- No model training on client data without explicit contractual authorisation
