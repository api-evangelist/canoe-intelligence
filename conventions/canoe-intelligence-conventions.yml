- name: X-Requested-With
  value: XMLHttpRequest
  required: true
  note: Present in every published code sample for all 47 sampled operations.
- name: X-API-VERSION
  value: <date>
  required: false
  note: Opts an operation into its dated behaviour train. Required to enable pagination on several collection endpoints.
idempotency:
  supported: false
  evidence: No Idempotency-Key header, parameter, or idempotency guidance appears anywhere in the published OpenAPI
