aid: canoe-intelligence
name: Canoe Intelligence
description: Canoe Intelligence is an alternative-investment data infrastructure platform that automates the collection,
  extraction, and validation of private-markets documents for institutional allocators, fund-of-funds, family offices,
  RIAs, fund administrators, and asset servicers. The platform retrieves capital call notices, distribution notices,
  capital account statements, K-1 tax documents, and related fund communications from GP portals and email, applies
  AI-based extraction across 50+ document types and a 2,586-field data library, validates the results against fund
  and LP records, and delivers structured data downstream. Canoe publishes a public REST API (Canoe API v1) at api.canoesoftware.com
  covering documents, funds, terms, organizations, entities, accounts, allocations, custom fields, and user management,
  documented with a public OpenAPI 3.0 definition and authenticated with OAuth 2.0 bearer/JWT access tokens.
