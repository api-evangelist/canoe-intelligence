  Idempotency: Not emitted. No Idempotency-Key header, parameter or guidance exists in the OpenAPI or the docs.
  MCPServer: 'Not emitted. mcp/canoe-intelligence-mcp.yml is status: candidate — Canoe publishes no MCP server (/mcp
    and /sse return 500).'
  SDKs/Packages: Not emitted. No first-party client library on npm, PyPI, Maven, NuGet, RubyGems, Packagist or crates.io,
    and no public GitHub organization (github.com/canoeintelligence redirects to an enterprise SSO gate).
  StatusPage: Not emitted. No status page exists; canoeintelligence.statuspage.io is a soft 404 that redirects to
    Atlassian marketing, and canoe.statuspage.io belongs to a different company.
  ChangeLog: Not emitted. Release notes live only inside the authenticated customer knowledge base at client.canoesoftware.com.
  Security/VulnerabilityDisclosure: Not emitted. No security.txt, no disclosure page, no bug bounty. See security/canoe-intelligence-vulnerability-disclosure.yml.
  AgentCard: Not emitted. /.well-known/agent-card.json and /.well-known/agent.json return 404 on every real host;
    the 200s on client.canoesoftware.com and trust.canoeintelligence.com are SPA catch-alls.
  AsyncAPI/Webhooks: Not emitted. Canoe publishes no event, streaming or webhook surface; the OpenAPI declares no
    callbacks or webhooks.
  Postman: Not emitted. The docs reference a Postman collection but it is not publicly downloadable (every candidate
    path 404s).
  GraphQL: Not emitted. https://api.canoesoftware.com/graphql exists but returns 401 "Unauthorized." to anonymous
    GET and POST introspection, and is undocumented.
  Pricing/SignUp: Not emitted. /pricing/ returns 404; the only entry point is a demo request form.
